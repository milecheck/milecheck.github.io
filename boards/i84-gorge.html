<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MileCheck — Live Corridor Board</title>
<!--
  v6 — config-per-location refactor of v5c-white (TF tracker #25).
  Public I-84 Columbia River Gorge demo board. Generated by scripts/gen-venue-demo-boards.py
  from the private corridor-boards index-v6.html. Do not hand-edit.
  Based on v5c-WHITE — the departures board Leah liked, in the white scheme.
  Same directional airport-board layout (◀ WESTBOUND / EASTBOUND ▶ columns of big tabular rows:
  LOCATION · MP · STATUS · distance) and the same live data — just a clean light "modern timetable"
  palette (warm paper, white panels, hairline rules, dark ink, colored status text) instead of the
  dark board. Reads like a crisp schedule from across a room. Dark v5c kept for comparison.
-->
<style>
  :root{--bg:#f3f1e8;--panel:#ffffff;--line:#e0dbcd;--dim:#7d786c;--ink:#14140f;
    --green:#0f7a4f;--amber:#c47f0a;--red:#cf3320;--blue:#2f6ea0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.01em;height:100vh;display:flex;flex-direction:column;padding:5vh 5vw;gap:1.2vh}
  .head{display:flex;align-items:center;gap:1.2vw;flex:none}
  .logo{width:2.2vh;height:2.2vh;border-radius:50%;background:var(--green)}
  .head h1{font-size:2.7vh;font-weight:800}.head .pb{font-size:1.6vh;color:var(--dim);font-weight:600;font-style:italic}
  .head .sp{flex:1}.head .clock{font-size:2.6vh;font-weight:800;font-variant-numeric:tabular-nums}
  .head .live{display:flex;align-items:center;gap:.5vw;font-size:1.7vh;font-weight:800;letter-spacing:.14em;margin-left:1.2vw;color:var(--green)}
  .head .live .r{width:1.3vh;height:1.3vh;border-radius:50%;background:var(--green);animation:blink 1.8s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* status strip + hero cam header */
  .top{flex:none;display:grid;grid-template-columns:1.15fr .85fr;gap:1.2vw;height:33vh}
  .statusbox{background:var(--panel);border:1px solid var(--line);border-radius:1vh;padding:1.4vh 1.6vw;display:flex;flex-direction:column;justify-content:center;gap:.4vh}
  .statusbox .sl{font-size:1.5vh;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .statusbox .sv{font-size:4.4vh;font-weight:900;line-height:1}
  .sv.ok{color:var(--green)}.sv.warn{color:var(--amber)}.sv.stop{color:var(--red)}
  .statusbox .sd{font-size:1.9vh;font-weight:700;color:var(--dim)}
  .herocam{background:#e7ede8;border:1px solid var(--line);border-radius:1vh;overflow:hidden;position:relative;min-height:0}
  .herocam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .herocam .hc{position:absolute;left:0;right:0;bottom:0;padding:1vh 1.2vw;background:linear-gradient(transparent,rgba(12,14,10,.82));color:#fff;font-size:1.9vh;font-weight:800}
  .herocam .hc .mi{color:#d8d3c5;font-weight:700}
  .herocam .tag{position:absolute;top:1vh;left:1vw;font-size:1.3vh;font-weight:800;letter-spacing:.1em;background:var(--red);color:#fff;padding:.3vh .8vw;border-radius:.5vh}

  /* the two directional boards */
  .boards{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;min-height:0}
  .board{background:var(--panel);border:1px solid var(--line);border-radius:1vh;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .bhd{flex:none;display:flex;align-items:baseline;justify-content:space-between;padding:1.2vh 1.4vw;border-bottom:2px solid var(--line)}
  .bhd .dir{font-size:2.4vh;font-weight:900;letter-spacing:.04em}
  .bhd.west .dir{color:var(--green)}.bhd.east .dir{color:var(--blue)}
  .bhd .to{font-size:2.1vh;font-weight:700;color:var(--dim)}
  .rows{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .row{flex:1;display:grid;grid-template-columns:1fr auto;align-items:center;gap:1vw;padding:0 1.4vw;border-bottom:1px solid var(--line)}
  .row:nth-child(even){background:#faf8f1}
  .row:last-child{border-bottom:none}
  .row .icn{font-size:2.6vh;margin-right:.6vw}
  .row .nm{min-width:0;font-size:3vh;line-height:1.15;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .nm .sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:2.5vh;font-weight:700;color:#5d584d;white-space:normal;overflow:hidden;line-height:1.15}
  .row .rt{text-align:right;white-space:nowrap;min-width:9vw}.row .dist.big{font-size:2.8vh;color:var(--ink)}
  .row .st{font-size:2.3vh;font-weight:900;font-variant-numeric:tabular-nums}
  .st.ok{color:var(--green)}.st.warn{color:var(--amber)}.st.stop{color:var(--red)}.st.cam{color:var(--blue)}
  .row .dist{font-size:2.2vh;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
  .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:2vh;font-weight:700}

  /* rotating sponsor ad banner (the venue's revenue slot) */
  .adbanner{flex:none;display:flex;align-items:center;gap:1.3vw;background:#faf6ee;border:1px solid var(--line);border-left:.55vh solid var(--amber);border-radius:1vh;padding:1vh 1.4vw;min-height:9.4vh}
  .adbanner .adtag{flex:none;font-size:2vh;font-weight:800;letter-spacing:.12em;color:var(--amber);border:1.5px solid var(--amber);border-radius:.5vh;padding:.3vh .8vw}
  .adbanner .anm{flex:1;min-width:0}
  .adbanner .anm b{font-size:2.9vh;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .adbanner .anm span{font-size:1.85vh;font-weight:700;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .adbanner .aq{width:8.2vh;height:8.2vh;flex:none;border-radius:.8vh;background:#fff;padding:.35vh;border:1px solid var(--line)}

  .foot{flex:none;display:flex;align-items:center;gap:1.2vw;padding:.3vh .2vw}
  .foot .tag{font-size:1.7vh;font-weight:700;color:var(--dim)}
  /* sports/dwell ticker lives in the footer-left */
  .foot .ticker{flex:1;display:flex;align-items:center;gap:1vw;overflow:hidden}
  .foot .ticker .tk-lbl{flex:none;font-size:1.5vh;font-weight:800;letter-spacing:.08em;color:var(--green)}
  .foot .ticker .tk-wrap{flex:1;overflow:hidden;white-space:nowrap}
  .foot .tk-scroll{display:inline-block;white-space:nowrap;font-size:1.8vh;font-weight:800;font-variant-numeric:tabular-nums;animation:none}
  @keyframes tkscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .foot .app{display:flex;align-items:center;gap:1vw;margin-left:auto}
  .foot .app img{width:6.6vh;height:6.6vh;border-radius:1vh;background:#fff;padding:.4vh;border:1px solid var(--line)}
  .foot .app .t{font-size:1.6vh;font-weight:700;color:#6b6456;line-height:1.2}.foot .app .t b{color:var(--ink)}
  .foot .up{font-size:1.8vh;color:#a99e88;font-weight:700}
.wxsun{font-size:14px;opacity:.75;margin-right:14px;white-space:nowrap}.wxsun b{font-weight:700}
body.noinset{padding:1.8vh 2vw}
.livebox{display:flex;flex-direction:column;align-items:flex-end;margin-left:1.2vw}.livebox .live{margin-left:0}.livebox .up{font-size:1.6vh;color:#8a8170;font-weight:700;white-space:nowrap}
</style>

  <div class="head">

<script>
// I-84 Columbia River Gorge demo board. Generated by scripts/gen-venue-demo-boards.py, edit there.
const _q=new URLSearchParams(location.search);
const _venue=(_q.get("venue")||"").trim().slice(0,40);
const _mp=Math.min(115,Math.max(40,parseFloat(_q.get("mp"))||64));
const _house=(_q.get("house")||"").split("|").map(x=>x.trim().slice(0,60)).filter(Boolean).slice(0,3);
const PCFG={

  here:[45.7106,-121.5021], route:"I-84", mile:_mp,

  dec:{name:"WEST OF HERE",short:"W"},
  inc:{name:"EAST OF HERE",short:"E"},
  camBase:"https://milepost-proxy.leahgerber93.workers.dev/camera-image?state=OR&id=",
  cameras:[
    {name:"Cascade Locks",mp:45,lat:45.66931,lon:-121.88484,file:"OR-205"},
    {name:"Wyeth",mp:54,lat:45.68788,lon:-121.70189,file:"OR-1125"},
    {name:"Hood River",mp:64,lat:45.71061,lon:-121.50208,file:"OR-429"},

    {name:"Biggs Junction",mp:105,lat:45.6713,lon:-120.83428,file:"OR-658"},
    {name:"John Day River",mp:114,lat:45.72919,lon:-120.65276,file:"OR-240"},
  ],
  services:[
    {name:"Demo sponsor space",headline:"One sponsor per board",url:"https://milecheckapp.com/partners/corridor-boards.html",demo:true},
  ].concat(_house.map(h=>({name:h,headline:"",house:true}))),
};

<script>
const WORKER="https://milepost-proxy.leahgerber93.workers.dev";
const {slug:LOC,cfg:P}=resolveLocation();
const HERE=P.here;
const CAM_BASE=P.camBase;
document.getElementById("hostName").textContent=_venue?"Welcome to "+P.venue:"Your store name goes here";
document.getElementById("corridorLabel").textContent=P.corridorLabel;
document.getElementById("decDir").textContent="\u25C0 "+P.dec.name;
document.getElementById("decTo").textContent=P.dec.to;
document.getElementById("incDir").textContent=P.inc.name+" \u25B6";
document.getElementById("incTo").textContent=P.inc.to;
document.title="MileCheck \u2014 "+P.short+" Corridor Board";
pingBoardView(LOC,"tv");
function cleanTxt(s){return (s||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();}
function miles(a,b,c,d){const R=3958.8,x=Math.sin((c-a)*Math.PI/360)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin((d-b)*Math.PI/360)**2;return R*2*Math.asin(Math.sqrt(x));}
const MPA=[{mp:P.mile,lat:HERE[0],lon:HERE[1]}].concat(P.cameras.map(c=>({mp:c.mp,lat:c.lat,lon:c.lon})));
function estimateMp(lat,lon){const s=MPA.map(a=>({mp:a.mp,d:miles(lat,lon,a.lat,a.lon)})).sort((x,y)=>x.d-y.d);const[a,b]=s;if(a.d<0.6)return Math.round(a.mp);return Math.round(a.mp+(b.mp-a.mp)*(a.d/(a.d+b.d)));}

let lastFetch=0,err=false;
const CLOSE_RE=/\b(?:road|highway|interstate|all lanes)\b[^.]{0,40}\bclos|closed to (?:all )?traffic|no travel|avalanche|blocked/i,PARTIAL_RE=/lane|shoulder|ramp|frontage|exit/i,CHAIN_RE=/chain/i;
const isFullClose=t=>CLOSE_RE.test(t)&&!PARTIAL_RE.test(t);
function statusOf(txt){if(isFullClose(txt))return"stop";if(CHAIN_RE.test(txt)||/snow|ice|pack|slush/i.test(txt))return"warn";return"warn";}
// Venue demo board, v2 display logic (2026-10-13, after the ChatGPT review).
// Injected by scripts/gen-venue-demo-boards.py in place of the private board's poll/render code.
// Changes, each from the review:
//  - an alert with no usable milepost is placed by its coordinates, or dropped. Never "MP 0".
//  - columns are places ("WEST OF HERE"), and each alert says which lanes it affects.
//  - a scheduled closure shows its start date and never counts as a current closure.
//  - "No traffic impacts" notices are dropped.
//  - place name, "toward" towns, clock time zone and the first camera all follow the store's exit.
const TOWNS = P.towns;
const tzAt = m => (P.tzEast && m >= P.tzEast.from) ? P.tzEast.tz : P.tz;
const TZ = tzAt(P.mile);
function nearTown(m){let b=null;for(const t of TOWNS){const d=Math.abs(t.mp-m);if(!b||d<b.d)b={n:t.n,d};}return b&&b.d<=12?b.n:null;}
function towardTowns(side){
  const list=TOWNS.filter(t=>side==="dec"?t.mp<P.mile-5:t.mp>P.mile+5).sort((a,b)=>side==="dec"?b.mp-a.mp:a.mp-b.mp);
  if(!list.length)return "";
  const picks=[list[0]];const far=list.filter(t=>Math.abs(t.mp-P.mile)<=150).pop()||list[0];if(far!==list[0])picks.push(far);
  return "toward "+picks.map(t=>t.n).join(" and ");
}
const _near=nearTown(P.mile);
document.getElementById("corridorLabel").textContent=P.route+" · "+(_near?"near "+_near:"milepost "+Math.round(P.mile))+", "+P.stateName;
document.getElementById("decDir").textContent="◀ "+P.dec.name;
document.getElementById("decTo").textContent=towardTowns("dec");
document.getElementById("incDir").textContent=P.inc.name+" ▶";
document.getElementById("incTo").textContent=towardTowns("inc");
document.getElementById("hostName").textContent=_venue?"Demo for "+P.venue:"Demo board";
document.title="MileCheck demo board · "+(_near||P.route);

MPA.splice(0,1);  // review v2 #3: P.here belongs to the base exit, not this store's
function anchorDist(lat,lon){return Math.min(...MPA.map(a=>miles(lat,lon,a.lat,a.lon)));}
const TYPE={AC:"Crash",CL:"Closure",RW:"Roadwork",IN:"Incident",HZ:"Hazard",WE:"Weather",VH:"Vehicle",OT:"Notice",CO:"Roadwork"};
function dirOf(r,t){const d=String(((r.location||{}).direction)||"")+" "+t;
  if(/\b(both|all) directions\b/i.test(d))return "both directions";
  const m=d.match(/\b(north|south|east|west)/i);return m?m[1][0].toUpperCase()+"B lanes":"";}
// A named place only: "Near E Dugas Rd (MP 268)" -> "E Dugas Rd". Never a route name or a fragment.
function placeOf(t){const m=t.match(/\b(?:near|at|from)\s+([A-Z][^(.,;]{2,30}?)\s*\(MP/)||t.match(/\b(?:near|at)\s+([A-Z][A-Za-z .'-]{2,30}?)(?=[.,;(]|$)/);
  if(!m)return "";const p=m[1].trim();return /^(I-?\d|US|SR|OR|AZ|Loop|roadway|the )/i.test(p)?"":p;}
const NEAR_MI=60;  // alerts farther than this aren't about the road outside the store
function schedText(st,en){const sameDay=fmtDay(st)===fmtDay(Date.now()/1000);
  const t=new Date(st*1000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit",timeZone:TZ});
  return sameDay?"Scheduled today at "+t:"Scheduled "+fmtDay(st)+(en&&fmtDay(en)!==fmtDay(st)?" through "+fmtDay(en):"");}
const fmtDay=s=>new Date(s*1000).toLocaleDateString([],{month:"short",day:"numeric",timeZone:TZ});
function ago(s){if(!s)return "";const m=Math.round((Date.now()/1000-s)/60);if(m<60)return m+" min ago";const h=Math.round(m/60);return h<48?h+" hr ago":Math.round(h/24)+" days ago";}

async function getFeed(path,key){
  const r=await fetch(WORKER+path,{cache:"no-store"});
  if(!r.ok)throw new Error(path+" "+r.status);
  const j=await r.json();
  if(!j||!Array.isArray(j[key]))throw new Error(path+" bad shape");
  return j;
}
// Milepost of a feed endpoint, or null. Blank or zero is not a milepost.
function mpOf(loc,k){const raw=loc[k+"-mile-marker"];return (raw!==""&&raw!=null&&isFinite(+raw)&&+raw>0)?+raw:null;}
async function poll(){
  try{
    const [cond,inc]=await Promise.all([
      getFeed("/conditions?state="+P.condState,"road-weather-reports"),
      getFeed("/incidents?state="+P.condState,"incident-reports"),
    ]);
    const now=Date.now()/1000;
    const alerts=(inc["incident-reports"]||[]).filter(r=>{const rid=String((r.location||{})["route-id"]||"").trim();return rid===P.alertRid||P.alertRe.test(rid);})
      .map(r=>{
        const t=cleanTxt(r.headline)+" "+cleanTxt(r["impact-desc"]);
        if(/no traffic impacts?/i.test(t))return null;
        const L=r.location||{},sl=L["start-location"]||{},el=L["end-location"]||{};
        const at=(ll,k)=>{let m=mpOf(ll,k);const la=ll[k+"-lat"],lo=ll[k+"-long"];
          if(m==null&&la!=null&&lo!=null&&anchorDist(+la,+lo)<20)m=estimateMp(+la,+lo);return m;};
        let a=at(sl,"start"),b=at(el,"end");if(a==null)a=b;if(b==null)b=a;
        if(a==null)return null;
        const lo=Math.min(a,b),hi=Math.max(a,b);
        const mp=P.mile<lo?lo:(P.mile>hi?hi:P.mile);  // nearest point of the affected stretch
        if(Math.abs(mp-P.mile)>NEAR_MI)return null;
        const full=r["is-full-closure"]===true||isFullClose(t);
        const start=+r["start-time"]||0,end=+r["end-time"]||0;
        if(end&&end<now)return null;
        // Short-lived events the DOT forgot to clear (a crash with no end time, untouched for 12 h): drop.
        // Roadwork and closures run for weeks and keep showing.
        const upd=+r["last-updated"]||start;
        if(/^(AC|IN|HZ|VH)$/.test(r["event-type-id"]||"")&&!end&&upd&&now-upd>12*3600)return null;
        const future=start>now;
        let type=TYPE[r["event-type-id"]]||"Notice";if(type==="Closure"&&!full)type=/ramp|exit/i.test(t)?"Ramp closure":"Lane closure";
        if(type==="Notice"&&/ramp/i.test(t))type="Ramp work";
        const place=placeOf(t);
        return {kind:"alert",name:type+(place?" · "+place:""),mp,stop:full&&!future,future,
          when:future?schedText(start,end):"",dir:dirOf(r,t),upd:ago(+r["last-updated"]),
          st:full?"stop":"warn"};
      }).filter(Boolean);
    const closed=alerts.filter(a=>a.stop).sort((a,b)=>Math.abs(a.mp-P.mile)-Math.abs(b.mp-P.mile))[0];
    const winter=cond["road-weather-reports"].filter(r=>{const L=r.location||{};const rid=String(L["route-id"]||r["route-id"]||"").trim();
        if(!(rid===P.alertRid||P.alertRe.test(rid)))return false;
        let m=mpOf(L["start-location"]||{},"start");const la=r.latitude,lo=r.longitude;
        if(m==null&&la!=null&&lo!=null&&anchorDist(+la,+lo)<20)m=estimateMp(+la,+lo);
        return m!=null&&Math.abs(m-P.mile)<=NEAR_MI;})
      .map(r=>r["road-surface-condition"]||"").find(s=>/snow|ice|pack|slush|chain/i.test(s));
    const sv=document.getElementById("statusVal"),sd=document.getElementById("statusDesc");
    if(closed){sv.className="sv stop";sv.textContent="CLOSURE REPORTED";const cd=Math.round(Math.abs(closed.mp-P.mile));sd.textContent=P.dot+": "+closed.name+", "+(cd<1?"at this exit":cd+" mi "+(closed.mp<P.mile?P.dec.short:P.inc.short))+(closed.dir?" · "+closed.dir:"");}
    else if(/chain/i.test(winter||"")){sv.className="sv warn";sv.textContent="CHAINS REPORTED";sd.textContent=P.dot+": "+winter;}
    else if(winter){sv.className="sv warn";sv.textContent="WINTER REPORT";sd.textContent=P.dot+": "+winter;}
    else{sv.className="sv ok";sv.textContent="NO CLOSURES REPORTED";sd.textContent=P.dot+" reports no current closures on "+P.route+" within "+NEAR_MI+" mi";}
    const cams=P.cameras.filter(c=>Math.abs(c.mp-P.mile)<=NEAR_MI).map(c=>({kind:"cam",name:c.name,mp:c.mp}));
    // Alerts first, nearest first, then the nearest cameras. Three rows a side: details wrap to two lines on a TV.
    const side=(f)=>{const a=alerts.filter(x=>f(x.mp)),c=cams.filter(x=>f(x.mp));const by=(p,q)=>Math.abs(p.mp-P.mile)-Math.abs(q.mp-P.mile);
      return a.sort(by).slice(0,3).concat(c.sort(by)).slice(0,3);};
    renderRows("westRows",side(m=>m<=P.mile),"dec"); renderRows("eastRows",side(m=>m>P.mile),"inc");
    lastFetch=Date.now();err=false;
  }catch(e){err=true;
    const sv=document.getElementById("statusVal");sv.className="sv warn";sv.textContent="REPORTS UNAVAILABLE";
    document.getElementById("statusDesc").textContent="Can't reach "+P.dot+" reports right now. Retrying every minute.";}
  tick();
}
function renderRows(elId,list,side){
  const el=document.getElementById(elId);
  if(!list.length){el.innerHTML=`<div class="empty">No ${P.dot} reports ${towardTowns(side)}</div>`;return;}
  el.innerHTML=list.map(x=>{
    const dm=Math.round(Math.abs(x.mp-P.mile)),dist=dm<1?"here":dm+" mi";
    if(x.kind==="cam")return `<div class="row"><div class="nm"><span class="icn">📷</span>${x.name}</div><div class="rt"><div class="dist big">${dist}</div></div></div>`;
    const label=x.future?"SCHEDULED":(x.stop?"CLOSED":"REPORTED");
    const sub=[x.when,x.dir,P.dot+(x.upd&&!x.future?" · "+x.upd:"")].filter(Boolean).join(" · ");  // a schedule's posting age reads as stale
    return `<div class="row"><div class="nm"><span class="icn">${x.stop?"⛔":(x.future?"🗓":"⚠")}</span>${x.name}<span class="sub">${sub}</span></div><div class="rt"><div class="st ${x.future?"cam":x.st}">${label}</div><div class="dist">${dist}</div></div></div>`;
  }).join("");
}
function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit",timeZone:TZ});
  const u=document.getElementById("updated");if(err){u.textContent="reconnecting…";return;}
  if(lastFetch){const s=Math.round((Date.now()-lastFetch)/1000);u.textContent="Board checked "+(s<8?"just now":s+"s ago");}}
// Hero camera: nearest first, then outward. Far ones say so.
const _byDist=P.cameras.slice().sort((a,b)=>Math.abs(a.mp-P.mile)-Math.abs(b.mp-P.mile));
const _close=_byDist.filter(c=>Math.abs(c.mp-P.mile)<=30);
const CAMS=_close.length?_close.slice(0,5):_byDist.slice(0,1);  // stay near the store when we can
let ci=0;
function cycleCam(){const c=CAMS[ci%CAMS.length];ci++;const d=Math.round(Math.abs(c.mp-P.mile));
  document.getElementById("camImg").src=CAM_BASE+encodeURIComponent(c.file)+"&t="+Date.now();
  document.getElementById("camCap").innerHTML=`${c.name} <span class="mi">· ${d<1?"here":d+" mi "+(c.mp<P.mile?P.dec.short:P.inc.short)}${d>30?" · farther along "+P.route:""}</span>`;}
// ADOT/ODOT serve a 540x330 "no live feed" card for dark cameras. Skip it, but
// stop after one full lap so an all-dark corridor doesn't loop forever.
let _dead=0;document.getElementById("camImg").addEventListener("load",e=>{const i=e.target;if(i.naturalWidth===540&&i.naturalHeight===330){if(++_dead<CAMS.length)cycleCam();}else _dead=0;});
cycleCam(); setInterval(cycleCam,6000);

// rotating sponsor ad
let adi=0;
function renderAd(){const a=P.services[adi%P.services.length];adi++;const b=document.getElementById("adBanner");
  b.innerHTML="";const nm=document.createElement("span");nm.className="anm";const bb=document.createElement("b");bb.textContent=a.name;nm.appendChild(bb);
  const hs=document.createElement("span");hs.textContent=a.headline;nm.appendChild(hs);b.appendChild(nm);
  const tg=document.createElement("span");tg.className="adtag";tg.textContent=a.house?"IN THE STORE":(a.demo?"DEMO SPONSOR SPACE":"SPONSOR");if(a.house)tg.style.background="#17150f";b.appendChild(tg);
  if(a.url){const q=document.createElement("img");q.className="aq";q.alt="";q.src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data="+encodeURIComponent(a.url);b.appendChild(q);}}
renderAd(); setInterval(renderAd,10000);

document.getElementById("tkScroll").textContent="Demo using live "+P.dot+" reports for "+P.route;
document.getElementById("tkLbl").textContent="● LIVE";

poll(); setInterval(poll,60000); setInterval(tick,1000);
</script>
</body>
