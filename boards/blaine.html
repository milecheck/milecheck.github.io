<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>MileCheck — Blaine / Border Crossings Board</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --paper:#f0eee6; --card:#fbfaf5; --ink:#17150f; --dim:#8c8677; --line:#dcd7c9;
    --green:#147a54; --green-deep:#0f5c3f; --red:#d63a1f; --amber:#b5771a; --blue:#2f6ea0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;
    background:var(--paper);container-type:inline-size;display:flex;flex-direction:column;overflow:hidden}

  header{flex:none;display:flex;align-items:center;gap:1.1cqw;padding:1.5cqw 2cqw;
    background:var(--card);border-bottom:1px solid var(--line)}
  .dot{width:1.4cqw;height:1.4cqw;border-radius:50%;background:var(--green);flex:none;
    box-shadow:0 0 1.2cqw rgba(20,122,84,.45)}
  .host{font-size:2cqw;font-weight:800;line-height:1.1}
  .pow{font-size:1.1cqw;font-weight:600;color:var(--dim)}
  .hspace{margin-left:auto;display:flex;align-items:center;gap:1.6cqw}
  .clock{font-size:1.9cqw;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
  .clock small{display:block;font-size:1.05cqw;font-weight:700;color:var(--dim)}
  .live{display:flex;align-items:center;gap:.55cqw;font-size:1.2cqw;font-weight:800;
    letter-spacing:.13em;color:var(--green)}
  .live i{width:.85cqw;height:.85cqw;border-radius:50%;background:var(--green);display:block;
    animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  main{flex:1;min-height:0;display:flex;flex-direction:column;padding:1.3cqw 2cqw;gap:1cqw}
  .dirline{flex:none;display:flex;align-items:baseline;gap:1cqw}
  .dirline h1{font-size:2.5cqw;font-weight:800;letter-spacing:-.02em}
  .dirline .note{font-size:1.25cqw;font-weight:700;color:var(--dim);margin-left:auto}

  .grid{flex:1.8;min-height:0;display:flex;gap:1.2cqw}
  .x{flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:.5cqw;
     background:var(--card);padding:1.1cqw 1.2cqw;display:flex;flex-direction:column;gap:.4cqw;
     transition:box-shadow .4s ease,border-color .4s ease}
  .x.best{border-color:var(--green);background:#eef6f1;box-shadow:inset 0 0 0 1px var(--green)}
  .x.shut{background:#f4f2ec}
  .flag{font-size:1.05cqw;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
    color:var(--dim);height:1.5cqw}
  .x.best .flag{color:var(--green)}
  .xname{font-size:2cqw;font-weight:800;line-height:1.05}
  .xsub{font-size:1.2cqw;font-weight:700;color:var(--dim)}
  /* Lane matrix — mirrors the app's border popup exactly: direction across the
     top, lane type down the side. The old layout showed one orphan "Trucks
     north" row with nothing to compare it against, which read as noise. */
  .mx{margin-top:.45cqw;display:grid;grid-template-columns:auto 1fr 1fr;
    column-gap:.7cqw;row-gap:.1cqw;align-items:baseline}
  .mxh{font-size:1.05cqw;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);white-space:nowrap;padding-bottom:.35cqw;
    border-bottom:1px solid var(--line);margin-bottom:.35cqw}
  .x.best .mxh{border-bottom-color:rgba(20,122,84,.35)}
  .mxc{font-size:1.05cqw;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--dim);white-space:nowrap}
  .wait{font-size:2.8cqw;font-weight:800;line-height:1.06;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;transition:color .4s ease;white-space:nowrap}
  .wait.ok{color:var(--green)} .wait.mid{color:var(--amber)} .wait.bad{color:var(--red)}
  .wait.na{color:var(--dim);font-size:1.5cqw;letter-spacing:-.01em;font-weight:700}
  .unit{font-size:1.05cqw;font-weight:700;color:var(--dim);margin-left:.2cqw}
  /* natural-fit camera — same fix as the Ritch board: whole WSDOT frame,
     header + timestamp intact, caption as its own bar rather than an overlay */
  .camrow{flex:1;min-height:0;display:flex;gap:1.2cqw;overflow:hidden}
  .camwrap{flex:1;min-height:0;border:1px solid var(--line);border-radius:.45cqw;overflow:hidden;
    background:#14171a;display:flex;flex-direction:column}
  .campane{flex:1;min-height:0;position:relative;display:flex;align-items:center;
    justify-content:center;padding:.25cqw}
  .campane img{width:100%;height:100%;object-fit:contain;display:block;animation:fade .45s ease}
  .camtag{position:absolute;top:.7cqw;left:.7cqw;z-index:2;font-size:.95cqw;font-weight:800;
    letter-spacing:.12em;background:var(--red);color:#fff;padding:.25cqw .7cqw;border-radius:.25cqw}
  .camcap{flex:none;background:var(--card);border-top:1px solid var(--line);padding:.5cqw 1cqw;
    display:flex;align-items:center;font-size:1.3cqw;font-weight:800}
  .camcap .mp{margin-left:auto;font-weight:800;color:var(--dim);font-size:1.15cqw}
  .lanes{margin-top:.35cqw;display:flex;flex-direction:column;gap:.2cqw}
  .lane{display:flex;font-size:1.25cqw;font-weight:700;font-variant-numeric:tabular-nums}
  .lane span:last-child{margin-left:auto}
  .lane .off{color:var(--dim);font-weight:700}
  .hrs{margin-top:auto;padding-top:.5cqw;border-top:1px solid var(--line);
    display:flex;font-size:1.1cqw;font-weight:700;color:var(--dim)}
  .hrs span:last-child{margin-left:auto;font-weight:800;color:var(--ink)}

  footer{flex:none;display:flex;align-items:stretch;border-top:1px solid var(--amber);background:#f6efdd}
  .ad{flex:1;display:flex;align-items:center;gap:1.2cqw;padding:1.1cqw 2cqw;min-width:0}
  .adtag{flex:none;font-size:1cqw;font-weight:800;letter-spacing:.13em;color:#fff;
    background:var(--amber);padding:.35cqw .9cqw;border-radius:.25cqw}
  .adtxt{font-size:1.65cqw;font-weight:700;color:#6d4a10;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;animation:fade .5s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .qr{flex:none;display:flex;align-items:center;gap:.9cqw;padding:.8cqw 2cqw .8cqw 1.4cqw;
    border-left:1px solid rgba(181,119,26,.45)}
  .qr svg{width:5.2cqw;height:5.2cqw;display:block;shape-rendering:crispEdges}
  .qrtx{font-size:1.15cqw;font-weight:800;color:#6d4a10;line-height:1.3}
  .qrtx small{display:block;font-weight:700;color:#8a6a2a;font-size:1cqw}
</style>

<div id="stage">
  <header>
    <span class="dot"></span>
    <div><div class="host">Blaine Shell</div><div class="pow">powered by MileCheck</div></div>
    <div class="hspace">
      <div class="live"><i></i>LIVE</div>
      <div class="clock"><span id="clock">--:--</span><small id="dateline">&nbsp;</small></div>
    </div>
  </header>

  <main>
    <div class="dirline">
      <h1>Border waits &mdash; both directions</h1>
      <span class="note">CBSA northbound &middot; CBP southbound &middot; updated <span id="age">&mdash;</span></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="camrow" id="camrow"></div>
  </main>

  <footer>
    <div class="ad"><span class="adtag">SPONSOR</span><span class="adtxt" id="adtxt">&nbsp;</span></div>
    <div class="qr">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" width="100%" height="100%" class="segno"><path class="qrline" stroke="#17150f" d="M0 0.5h7m6 0h3m2 0h1m3 0h7m-29 1h1m5 0h1m1 0h1m3 0h1m2 0h1m1 0h1m2 0h1m1 0h1m5 0h1m-29 1h1m1 0h3m1 0h1m1 0h2m4 0h1m1 0h1m2 0h1m2 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m1 0h2m2 0h1m1 0h4m2 0h1m1 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m4 0h1m1 0h3m1 0h4m1 0h1m1 0h3m1 0h1m-29 1h1m5 0h1m5 0h3m7 0h1m5 0h1m-29 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-21 1h4m1 0h1m5 0h2m-21 1h1m5 0h1m1 0h2m2 0h1m1 0h2m1 0h3m1 0h2m2 0h3m-28 1h2m2 0h1m3 0h3m3 0h1m1 0h5m2 0h2m1 0h2m-28 1h3m1 0h3m1 0h3m1 0h1m2 0h3m3 0h1m1 0h2m-25 1h2m1 0h1m3 0h1m2 0h2m2 0h1m1 0h1m4 0h5m-26 1h2m2 0h3m1 0h2m2 0h5m1 0h2m2 0h2m4 0h1m-29 1h2m5 0h1m2 0h2m1 0h5m1 0h2m1 0h3m2 0h2m-26 1h1m2 0h3m1 0h1m2 0h3m1 0h1m3 0h2m1 0h3m-27 1h1m1 0h1m1 0h2m1 0h1m1 0h1m2 0h4m4 0h1m1 0h2m2 0h1m1 0h1m-29 1h5m1 0h1m1 0h2m4 0h1m2 0h1m2 0h1m4 0h2m-27 1h2m7 0h2m4 0h2m2 0h2m1 0h3m1 0h3m-29 1h4m1 0h2m1 0h2m3 0h3m3 0h1m2 0h1m1 0h2m2 0h1m-29 1h1m3 0h1m3 0h2m2 0h1m1 0h1m3 0h1m2 0h1m-22 1h1m1 0h1m1 0h1m1 0h3m1 0h2m5 0h2m1 0h5m1 0h3m-21 1h1m4 0h1m1 0h1m1 0h1m2 0h1m3 0h2m-26 1h7m2 0h2m1 0h5m2 0h2m1 0h1m1 0h3m-27 1h1m5 0h1m2 0h1m1 0h3m5 0h2m3 0h1m3 0h1m-29 1h1m1 0h3m1 0h1m2 0h5m1 0h2m2 0h7m1 0h2m-29 1h1m1 0h3m1 0h1m2 0h3m1 0h1m1 0h2m1 0h4m3 0h2m1 0h1m-29 1h1m1 0h3m1 0h1m2 0h1m1 0h2m1 0h2m1 0h2m1 0h8m-28 1h1m5 0h1m2 0h1m1 0h4m3 0h1m3 0h5m1 0h1m-29 1h7m1 0h1m1 0h2m2 0h1m2 0h1m1 0h1m2 0h2m2 0h1"/></svg>

      <div class="qrtx">Check before<br>you go<small>Scan &middot; free app</small></div>
    </div>
  </footer>
</div>

<script>
const API='https://milepost-proxy.leahgerber93.workers.dev';
const REFRESH=5*60*1000, CAMDWELL=6000;

// Each crossing carries BOTH sides: the CBSA point-of-entry name (northbound,
// into Canada) and the CBP port/crossing (southbound, into the US). A driver
// filling up in Blaine is usually heading NORTH, so that number leads.
const WANT=[
  {road:'I-5',     nm:'Peace Arch',      away:'1 mi',  kind:'Cars only',
   ca:'Douglas',               us:{port:'Blaine', crossing:'Peace Arch'}},
  {road:'SR 543',  nm:'Pacific Highway', away:'3 mi',  kind:'Cars & trucks',
   ca:'Pacific Highway',       us:{port:'Blaine', crossing:'Pacific Highway'}},
  {road:'SR 539',  nm:'Lynden',          away:'17 mi', kind:'Cars & trucks',
   ca:'Aldergrove',            us:{port:'Lynden', crossing:''}},
];

// WSDOT cameras looking at the crossings themselves.
// Eight cameras, not four. WSDOT serves a "This image is currently
// unavailable" card at the SAME url, SAME dimensions (335x249) and a similar
// file size as a live frame, and sends no CORS header — so a static page has no
// honest way to tell them apart. Widening the rotation is the real mitigation:
// one dead camera is now an eighth of the airtime instead of half the screen.
const CAMS=[
  {nm:'Peace Arch',      mp:'I-5 · MP 276.5',      u:'https://images.wsdot.wa.gov/nw/005vc27650.jpg'},
  {nm:'Truck Spur',      mp:'SR 543 · MP 0.9',     u:'https://images.wsdot.wa.gov/nw/543vc00099.jpg'},
  {nm:'Duty Free',       mp:'SR 543 · MP 0.9',     u:'https://images.wsdot.wa.gov/nw/543vc00098.jpg'},
  {nm:'Lynden',          mp:'SR 539 · MP 15.1',    u:'https://images.wsdot.wa.gov/nw/539vc01510.jpg'},
  {nm:'D St',            mp:'SR 543 · MP 0.8',     u:'https://images.wsdot.wa.gov/nw/543vc00081.jpg'},
  {nm:'SR 543 Interchange',mp:'I-5 · MP 275.1',    u:'https://images.wsdot.wa.gov/nw/005vc27512.jpg'},
  {nm:'Peace Portal Dr', mp:'I-5 · MP 274.1',      u:'https://images.wsdot.wa.gov/nw/005vc27416.jpg'},
  {nm:'H St Rd',         mp:'SR 539 · MP 14.6',    u:'https://images.wsdot.wa.gov/nw/539vc01467.jpg'},
];

const ADS=[
  'Birch Bay Duty Free — last exit before the line',
  'Cascade Currency Exchange — better rate than the airport',
  'Semiahmoo Resort — 10 minutes away, rooms tonight',
];
const $=id=>document.getElementById(id);

function tickClock(){const d=new Date();
  $('clock').textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  $('dateline').textContent=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
setInterval(tickClock,1000);tickClock();

let ai=-1;
function nextAd(){ai=(ai+1)%ADS.length;const e=$('adtxt');e.textContent=ADS[ai];
  e.style.animation='none';void e.offsetWidth;e.style.animation='';}
nextAd();setInterval(nextAd,20000);

// ---- cameras (natural-fit, whole WSDOT frame kept) ----
$('camrow').innerHTML=CAMS.slice(0,2).map((_,i)=>
  `<div class="camwrap"><div class="campane">${i===0?'<span class="camtag">LIVE CAMERA</span>':''}`
  +`<img id="ci${i}" alt=""></div><div class="camcap"><span id="cn${i}">—</span>`
  +`<span class="mp" id="cm${i}">—</span></div></div>`).join('');
// Which cameras are actually serving fresh frames. The Worker samples them on
// its cron and flags any whose bytes haven't changed in 30 min — that's the only
// way to catch WSDOT's placeholder card, which is byte-similar to a real frame
// and served without CORS. Null until the first poll answers; unknown cameras
// and a failed poll both fail open, so the row never blanks.
let LIVECAM=null;
async function loadCamLive(){
  try{
    const d=await fetch(API+'/camera-live').then(r=>r.json());
    if(d&&d.cameras) LIVECAM=d.cameras;
  }catch(e){}
}
function liveCams(){
  if(!LIVECAM) return CAMS;
  const ok=CAMS.filter(c=>{const s=LIVECAM[c.u];return !s||s.live;});
  return ok.length>=2?ok:CAMS;
}
loadCamLive();setInterval(loadCamLive,5*60*1000);

let ci=0;
function rotateCams(){
  const CAMS=liveCams();
  for(let s=0;s<2;s++){
    const c=CAMS[(ci+s)%CAMS.length];
    const img=$('ci'+s);
    // No client-side sniffing: every WSDOT camera, live or dead, is 335x249, so
    // the old aspect-ratio test sat exactly on the real cameras' ratio and could
    // reject good frames. Detection now happens in the Worker, over time.
    img.src=c.u+'?t='+Date.now();
    img.style.animation='none';void img.offsetWidth;img.style.animation='';
    $('cn'+s).textContent=c.nm; $('cm'+s).textContent=c.mp;
  }
  ci=(ci+2)%CAMS.length;
}
rotateCams();setInterval(rotateCams,CAMDWELL);

// CBP: delay_minutes is a STRING, often '', with the meaning in
// operational_status. '' + "Lanes Closed" is NOT a zero wait.
// "N/A" status means the crossing has no lanes of that type at all (Peace Arch
// runs no commercial lanes) — different from a lane that exists but is closed,
// and different again from one that's open with no reported delay.
function cbpLane(L){
  if(!L) return {n:null,closed:false,na:true};
  const st=(L.operational_status||'').toLowerCase();
  const raw=(L.delay_minutes??'').toString().trim();
  const n=raw===''?null:parseInt(raw,10);
  return {n:Number.isFinite(n)?n:null, closed:st.includes('closed'), na:st==='n/a'};
}
// CBSA: negative delay encodes "Not Applicable" (Douglas has no truck lanes).
function caDelay(v){return (typeof v==='number' && v>=0)?v:null;}
function caNA(status){return /not applicable/i.test(status||'');}

const cls=n=>n==null?'na':n<=10?'ok':n<=30?'mid':'bad';
const show=(n,closed)=>closed?'Closed':(n==null?'—':n);

// One cell of the lane matrix. Three distinct states the old board blurred
// together: no lanes of this type here (n/a), lanes exist but shut (Closed),
// and a real reported wait.
function cell(n,na,closed){
  if(na)     return '<span class="wait na">n/a</span>';
  if(closed) return '<span class="wait na">Closed</span>';
  if(n==null)return '<span class="wait na">&mdash;</span>';
  return `<span class="wait ${cls(n)}">${n}<span class="unit">min</span></span>`;
}
// Mirrors the app's "Lanes:" line — the same fix that cleared up this exact
// confusion in the app after the June TestFlight round.
function laneSummary(r){
  const comm = !(r.usTrucks.na && (r.caTrucksNA||r.caMissing));
  const pass = !(r.usCars.na   && (r.caCarsNA  ||r.caMissing));
  return comm&&pass?'Commercial &middot; Passenger':comm?'Commercial only':pass?'Passenger only':'&mdash;';
}

async function load(){
  let ca=[],us=[];
  try{ const d=await fetch(API+'/border-waits-ca').then(r=>r.json()); ca=d.waitTimes||[]; }catch(e){}
  try{ const d=await fetch(API+'/border-waits').then(r=>r.json()); us=Array.isArray(d)?d:(d.port||[]); }catch(e){}

  const rows=WANT.map(w=>{
    const c=ca.find(x=>(x['poe-name']||'').trim()===w.ca);
    const u=us.find(x=>(x.port_name||'').trim()===w.us.port &&
                       (w.us.crossing?(x.crossing_name||'').trim()===w.us.crossing:true));
    const open=u?!/closed/i.test(u.port_status||''):true;
    return {
      ...w,
      caCars:     c?caDelay(c['poe-trav-delay']):null,
      caTrucks:   c?caDelay(c['poe-comm-delay']):null,
      caCarsNA:   c?caNA(c['poe-trav-status']):true,
      caTrucksNA: c?caNA(c['poe-comm-status']):true,
      caMissing: !c,
      usCars:   u?cbpLane(u.passenger_vehicle_lanes  && u.passenger_vehicle_lanes.standard_lanes) :{n:null,closed:false,na:true},
      usTrucks: u?cbpLane(u.commercial_vehicle_lanes && u.commercial_vehicle_lanes.standard_lanes):{n:null,closed:false,na:true},
      open, hours:(u&&u.hours)||'', when:(u&&u.date&&u.time)?u.date+' '+u.time:''
    };
  });

  // "Fastest" is judged on the NORTHBOUND number — that's the trip these
  // customers are about to take.
  let best=-1,bn=Infinity;
  rows.forEach((r,i)=>{ if(r.open && r.caCars!=null && r.caCars<bn){bn=r.caCars;best=i;} });

  $('grid').innerHTML=rows.map((r,i)=>{
    if(!r.open) return `<div class="x shut"><div class="flag">${r.road}</div>
      <div class="xname">${r.nm}</div><div class="xsub">${r.kind} · ${r.away}</div>
      <div class="dirs"><span class="wait na">Closed</span></div>
      <div class="hrs"><span>Hours</span><span>${r.hours||'—'}</span></div></div>`;
    return `<div class="x${i===best?' best':''}">
      <div class="flag">${i===best?'● Fastest into Canada':r.road}</div>
      <div class="xname">${r.nm}</div>
      <div class="xsub">${r.kind} · ${r.away}</div>
      <div class="mx">
        <span class="mxh"></span>
        <span class="mxh">&#8593; Into Canada</span>
        <span class="mxh">&#8595; Into U.S.</span>

        <span class="mxc">Commercial</span>
        ${cell(r.caTrucks, r.caTrucksNA||r.caMissing, false)}
        ${cell(r.usTrucks.n, r.usTrucks.na, r.usTrucks.closed)}

        <span class="mxc">Passenger</span>
        ${cell(r.caCars, r.caCarsNA||r.caMissing, false)}
        ${cell(r.usCars.n, r.usCars.na, r.usCars.closed)}
      </div>
      <div class="lanes">
        <div class="lane"><span>Lanes</span><span>${laneSummary(r)}</span></div>
      </div>
      <div class="hrs"><span>Hours</span><span>${r.hours||'—'}</span></div>
    </div>`;}).join('');

  const s=rows.find(r=>r.when);
  $('age').textContent=s?new Date(s.when).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'just now';
}
load();setInterval(load,REFRESH);
</script>
</html>
