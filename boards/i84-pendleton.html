<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MileCheck — Live Corridor Board</title>
<!--
  v6 — config-per-location refactor of v5c-white (TF tracker #25).
  Public I-84 Pendleton demo board. Generated by scripts/gen-venue-demo-boards.py
  from the private corridor-boards index-v6.html. Do not hand-edit.
  Based on v5c-WHITE — the departures board Leah liked, in the white scheme.
  Same directional airport-board layout (◀ WESTBOUND / EASTBOUND ▶ columns of big tabular rows:
  LOCATION · MP · STATUS · distance) and the same live data — just a clean light "modern timetable"
  palette (warm paper, white panels, hairline rules, dark ink, colored status text) instead of the
  dark board. Reads like a crisp schedule from across a room. Dark v5c kept for comparison.
-->
<style>
  :root{--bg:#f3f1e8;--panel:#ffffff;--line:#e0dbcd;--dim:#7d786c;--ink:#14140f;
    --green:#0f7a4f;--amber:#c47f0a;--red:#cf3320;--blue:#2f6ea0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.01em;height:100vh;display:flex;flex-direction:column;padding:1.8vh 2vw;gap:1.2vh}
  .head{display:flex;align-items:center;gap:1.2vw;flex:none}
  .logo{width:2.2vh;height:2.2vh;border-radius:50%;background:var(--green)}
  .head h1{font-size:2.7vh;font-weight:800}.head .pb{font-size:1.6vh;color:var(--dim);font-weight:600;font-style:italic}
  .head .sp{flex:1}.head .clock{font-size:2.6vh;font-weight:800;font-variant-numeric:tabular-nums}
  .head .live{display:flex;align-items:center;gap:.5vw;font-size:1.7vh;font-weight:800;letter-spacing:.14em;margin-left:1.2vw;color:var(--green)}
  .head .live .r{width:1.3vh;height:1.3vh;border-radius:50%;background:var(--green);animation:blink 1.8s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* status strip + hero cam header */
  .top{flex:none;display:grid;grid-template-columns:1.15fr .85fr;gap:1.2vw;height:33vh}
  .statusbox{background:var(--panel);border:1px solid var(--line);border-radius:1vh;padding:1.4vh 1.6vw;display:flex;flex-direction:column;justify-content:center;gap:.4vh}
  .statusbox .sl{font-size:1.5vh;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .statusbox .sv{font-size:4.4vh;font-weight:900;line-height:1}
  .sv.ok{color:var(--green)}.sv.warn{color:var(--amber)}.sv.stop{color:var(--red)}
  .statusbox .sd{font-size:1.9vh;font-weight:700;color:var(--dim)}
  .herocam{background:#e7ede8;border:1px solid var(--line);border-radius:1vh;overflow:hidden;position:relative;min-height:0}
  .herocam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .herocam .hc{position:absolute;left:0;right:0;bottom:0;padding:1vh 1.2vw;background:linear-gradient(transparent,rgba(12,14,10,.82));color:#fff;font-size:1.9vh;font-weight:800}
  .herocam .hc .mi{color:#d8d3c5;font-weight:700}
  .herocam .tag{position:absolute;top:1vh;left:1vw;font-size:1.3vh;font-weight:800;letter-spacing:.1em;background:var(--red);color:#fff;padding:.3vh .8vw;border-radius:.5vh}

  /* the two directional boards */
  .boards{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;min-height:0}
  .board{background:var(--panel);border:1px solid var(--line);border-radius:1vh;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .bhd{flex:none;display:flex;align-items:baseline;justify-content:space-between;padding:1.2vh 1.4vw;border-bottom:2px solid var(--line)}
  .bhd .dir{font-size:2.4vh;font-weight:900;letter-spacing:.04em}
  .bhd.west .dir{color:var(--green)}.bhd.east .dir{color:var(--blue)}
  .bhd .to{font-size:1.6vh;font-weight:700;color:var(--dim)}
  .rows{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .row{flex:1;display:grid;grid-template-columns:1fr auto;align-items:center;gap:1vw;padding:0 1.4vw;border-bottom:1px solid var(--line)}
  .row:nth-child(even){background:#faf8f1}
  .row:last-child{border-bottom:none}
  .row .icn{font-size:2.6vh;margin-right:.6vw}
  .row .nm{font-size:2.3vh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .nm .sub{display:block;font-size:1.5vh;font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .rt{text-align:right;white-space:nowrap}
  .row .st{font-size:2vh;font-weight:900;font-variant-numeric:tabular-nums}
  .st.ok{color:var(--green)}.st.warn{color:var(--amber)}.st.stop{color:var(--red)}.st.cam{color:var(--blue)}
  .row .dist{font-size:1.5vh;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
  .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:2vh;font-weight:700}

  /* rotating sponsor ad banner (the venue's revenue slot) */
  .adbanner{flex:none;display:flex;align-items:center;gap:1.3vw;background:#faf6ee;border:1px solid var(--line);border-left:.55vh solid var(--amber);border-radius:1vh;padding:1vh 1.4vw;min-height:9.4vh}
  .adbanner .adtag{flex:none;font-size:1.3vh;font-weight:800;letter-spacing:.12em;color:var(--amber);border:1.5px solid var(--amber);border-radius:.5vh;padding:.3vh .8vw}
  .adbanner .anm{flex:1;min-width:0}
  .adbanner .anm b{font-size:2.9vh;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .adbanner .anm span{font-size:1.85vh;font-weight:700;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .adbanner .aq{width:8.2vh;height:8.2vh;flex:none;border-radius:.8vh;background:#fff;padding:.35vh;border:1px solid var(--line)}

  .foot{flex:none;display:flex;align-items:center;gap:1.2vw;padding:.3vh .2vw}
  .foot .tag{font-size:1.7vh;font-weight:700;color:var(--dim)}
  /* sports/dwell ticker lives in the footer-left */
  .foot .ticker{flex:1;display:flex;align-items:center;gap:1vw;overflow:hidden}
  .foot .ticker .tk-lbl{flex:none;font-size:1.5vh;font-weight:800;letter-spacing:.08em;color:var(--green)}
  .foot .ticker .tk-wrap{flex:1;overflow:hidden;white-space:nowrap}
  .foot .tk-scroll{display:inline-block;white-space:nowrap;font-size:1.8vh;font-weight:800;font-variant-numeric:tabular-nums;animation:tkscroll 42s linear infinite}
  @keyframes tkscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .foot .app{display:flex;align-items:center;gap:1vw;margin-left:auto}
  .foot .app img{width:6.6vh;height:6.6vh;border-radius:1vh;background:#fff;padding:.4vh;border:1px solid var(--line)}
  .foot .app .t{font-size:1.6vh;font-weight:700;color:#6b6456;line-height:1.2}.foot .app .t b{color:var(--ink)}
  .foot .up{font-size:1.4vh;color:#a99e88;font-weight:700}
.wxsun{font-size:14px;opacity:.75;margin-right:14px;white-space:nowrap}.wxsun b{font-weight:700}
</style>
</head>
<body>
  <div class="head">
    <span class="logo"></span>
    <h1 id="hostName">Welcome</h1><span class="pb">powered by MileCheck</span>
    <span class="sp"></span><span class="wxsun" id="wxSun"></span><span class="clock" id="clock">—</span>
    <span class="live"><span class="r"></span>LIVE</span>
  </div>

  <div class="top">
    <div class="statusbox"><span class="sl" id="corridorLabel">—</span><span class="sv ok" id="statusVal">CHECKING…</span><span class="sd" id="statusDesc"></span></div>
    <div class="herocam"><span class="tag">● LIVE</span><img id="camImg" src="" alt=""><div class="hc" id="camCap">—</div></div>
  </div>

  <div class="boards">
    <div class="board"><div class="bhd west"><span class="dir" id="decDir">◀ —</span><span class="to" id="decTo"></span></div><div class="rows" id="westRows"></div></div>
    <div class="board"><div class="bhd east"><span class="dir" id="incDir">— ▶</span><span class="to" id="incTo"></span></div><div class="rows" id="eastRows"></div></div>
  </div>

  <div class="adbanner" id="adBanner"></div>

  <div class="foot">
    <div class="ticker"><span class="tk-lbl" id="tkLbl">⚾ SCORES</span><div class="tk-wrap"><span class="tk-scroll" id="tkScroll">Live cameras & DOT alerts · updated every minute</span></div></div>
    <div class="app"><img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data=https%3A%2F%2Fmilecheckapp.com" alt=""><div class="t"><b>Take these alerts with you</b><br>Scan · milecheckapp.com</div></div>
    <span class="up" id="updated">—</span>
  </div>

<script>
// I-84 Pendleton demo board. Generated by scripts/gen-venue-demo-boards.py, edit there.
const _q=new URLSearchParams(location.search);
const _venue=(_q.get("venue")||"").trim().slice(0,40);
const _mp=Math.min(230,Math.max(195,parseFloat(_q.get("mp"))||210));
const _house=(_q.get("house")||"").split("|").map(x=>x.trim().slice(0,60)).filter(Boolean).slice(0,3);
const PCFG={
  venue:_venue||"your store", short:"Pendleton",
  corridorLabel:"I-84 · Pendleton, Oregon", region:"Blue Mountains",
  here:[45.672,-118.788], route:"I-84", mile:_mp,
  condState:"OR", dot:"ODOT", alertRid:"I84", alertRe:/^I-?84$/,
  dec:{name:"WESTBOUND",to:"toward Hermiston and Portland"},
  inc:{name:"EASTBOUND",to:"toward Cabbage Hill and La Grande"},
  camBase:"https://milepost-proxy.leahgerber93.workers.dev/camera-image?state=OR&id=",
  cameras:[
    {name:"Boardman",mp:168,lat:45.8336,lon:-119.6232,file:"OR-537"},
    {name:"Stanfield",mp:190,lat:45.7602,lon:-119.1862,file:"OR-791"},
    {name:"Lorenzen Road",mp:199,lat:45.7182,lon:-119.0148,file:"OR-242"},
    {name:"Barnhart Road",mp:203,lat:45.6911,lon:-118.9336,file:"OR-728"},
    {name:"Pendleton east",mp:214,lat:45.6565,lon:-118.7168,file:"OR-840"},
    {name:"Mission",mp:220,lat:45.6016,lon:-118.6400,file:"OR-1059"},
    {name:"Cabbage Hill",mp:224,lat:45.5857,lon:-118.5993,file:"OR-1049"},
    {name:"Deadman Pass",mp:229,lat:45.5998,lon:-118.5019,file:"OR-1043"},
    {name:"Meacham",mp:237,lat:45.5132,lon:-118.4325,file:"OR-1041"},
    {name:"Spring Creek",mp:247,lat:45.3893,lon:-118.3195,file:"OR-1040"},
  ],
  services:[
    {name:"Your business here",headline:"One sponsor per board · demo",url:"https://milecheckapp.com/partners/corridor-boards.html",demo:true},
  ].concat(_house.map(h=>({name:h,headline:"",house:true}))),
};
function resolveLocation(){return {slug:"i84-pendleton",cfg:PCFG};}
function pingBoardView(){}
</script>
<script>
const WORKER="https://milepost-proxy.leahgerber93.workers.dev";
const {slug:LOC,cfg:P}=resolveLocation();
const HERE=P.here;
// sunrise/sunset line — restored 2026-07-22 (existed v3–v5a, dropped in the v5b+
// rewrite; Leah flagged the regression). Compact single-day form from mobile-v6.
(async()=>{try{
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${HERE[0]}&longitude=${HERE[1]}&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
  const d=(await (await fetch(u)).json()).daily;
  const fmtT=x=>new Date(x).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  if(d) document.getElementById("wxSun").innerHTML=`☀ <b>${fmtT(d.sunrise[0])}</b> · 🌙 <b>${fmtT(d.sunset[0])}</b>`;
}catch(e){}})();
const CAM_BASE=P.camBase;
document.getElementById("hostName").textContent=_venue?"Welcome to "+P.venue:"Your store name goes here";
document.getElementById("corridorLabel").textContent=P.corridorLabel;
document.getElementById("decDir").textContent="\u25C0 "+P.dec.name;
document.getElementById("decTo").textContent=P.dec.to;
document.getElementById("incDir").textContent=P.inc.name+" \u25B6";
document.getElementById("incTo").textContent=P.inc.to;
document.title="MileCheck \u2014 "+P.short+" Corridor Board";
pingBoardView(LOC,"tv");
function cleanTxt(s){return (s||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();}
function miles(a,b,c,d){const R=3958.8,x=Math.sin((c-a)*Math.PI/360)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin((d-b)*Math.PI/360)**2;return R*2*Math.asin(Math.sqrt(x));}
const MPA=[{mp:P.mile,lat:HERE[0],lon:HERE[1]}].concat(P.cameras.map(c=>({mp:c.mp,lat:c.lat,lon:c.lon})));
function estimateMp(lat,lon){const s=MPA.map(a=>({mp:a.mp,d:miles(lat,lon,a.lat,a.lon)})).sort((x,y)=>x.d-y.d);const[a,b]=s;if(a.d<0.6)return Math.round(a.mp);return Math.round(a.mp+(b.mp-a.mp)*(a.d/(a.d+b.d)));}

let lastFetch=0,err=false;
const CLOSE_RE=/\b(?:road|highway|interstate|all lanes)\b[^.]{0,40}\bclos|closed to (?:all )?traffic|no travel|avalanche|blocked/i,PARTIAL_RE=/lane|shoulder|ramp|frontage|exit/i,CHAIN_RE=/chain/i;
const isFullClose=t=>CLOSE_RE.test(t)&&!PARTIAL_RE.test(t);
function statusOf(txt){if(isFullClose(txt))return"stop";if(CHAIN_RE.test(txt)||/snow|ice|pack|slush/i.test(txt))return"warn";return"warn";}
async function poll(){
  try{
    const [cond,inc]=await Promise.all([
      fetch(WORKER+"/conditions?state="+P.condState,{cache:"no-store"}).then(r=>r.json()).catch(()=>({})),
      fetch(WORKER+"/incidents?state="+P.condState,{cache:"no-store"}).then(r=>r.json()).catch(()=>({})),
    ]);
    const txtOf=r=>cleanTxt(r.headline)+" "+cleanTxt(r["impact-desc"]);
    const alerts=(inc["incident-reports"]||[]).filter(r=>{const rid=String((r.location||{})["route-id"]||"").trim();return rid===P.alertRid||P.alertRe.test(rid);})
      .map(r=>{const sl=(r.location||{})["start-location"]||{};let lat=sl["start-lat"],lon=sl["start-long"];let mp=sl["start-mile-marker"]!=null&&isFinite(+sl["start-mile-marker"])?+sl["start-mile-marker"]:(lat!=null&&lon!=null?estimateMp(lat,lon):null);if(mp==null)return null;const t=txtOf(r);return {kind:"alert",name:cleanTxt(r.headline)||"Incident",mp,st:statusOf(t),stop:isFullClose(t)};}).filter(Boolean);
    const closed=alerts.find(a=>a.stop),winter=(cond["road-weather-reports"]||[]).map(r=>r["road-surface-condition"]||"").find(s=>/snow|ice|pack|slush|chain/i.test(s));
    const sv=document.getElementById("statusVal"),sd=document.getElementById("statusDesc");
    if(closed){sv.className="sv stop";sv.textContent="CLOSED";sd.textContent="MP "+Math.round(closed.mp)+" · "+closed.name;}
    else if(/chain/i.test(winter||"")){sv.className="sv warn";sv.textContent="CHAINS REQ'D";sd.textContent="Winter conditions — "+P.region;}
    else if(winter){sv.className="sv warn";sv.textContent="WINTER";sd.textContent=winter;}
    else{sv.className="sv ok";sv.textContent="OPEN · CLEAR";sd.textContent="Bare & dry, no winter conditions";}
    const cams=P.cameras.map(c=>({kind:"cam",name:c.name,mp:c.mp}));
    const all=cams.concat(alerts);
    const west=all.filter(x=>x.mp<=P.mile).sort((a,b)=>(P.mile-a.mp)-(P.mile-b.mp));
    const east=all.filter(x=>x.mp>P.mile).sort((a,b)=>(a.mp-P.mile)-(b.mp-P.mile));
    renderRows("westRows",west,"west"); renderRows("eastRows",east,"east");
    lastFetch=Date.now();err=false;
  }catch(e){err=true;}
  tick();
}
function renderRows(elId,list,side){
  const el=document.getElementById(elId);
  if(!list.length){el.innerHTML=`<div class="empty">✓ Clear ${side==="west"?P.dec.to:P.inc.to}</div>`;return;}
  el.innerHTML=list.slice(0,5).map(x=>{
    const dist=Math.round(Math.abs(x.mp-P.mile))+" mi";
    if(x.kind==="cam")return `<div class="row"><div class="nm"><span class="icn">📷</span>${x.name}<span class="sub">Live camera</span></div><div class="rt"><div class="st cam">CAM</div><div class="dist">MP ${x.mp} · ${dist}</div></div></div>`;
    const label=x.stop?"CLOSED":(x.st==="warn"?"CAUTION":"ALERT");
    return `<div class="row"><div class="nm"><span class="icn">${x.stop?"⛔":"⚠"}</span>${x.name}<span class="sub">${P.dot} live alert</span></div><div class="rt"><div class="st ${x.st}">${label}</div><div class="dist">MP ${Math.round(x.mp)} · ${dist}</div></div></div>`;
  }).join("");
}
function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});const u=document.getElementById("updated");if(err){u.textContent="reconnecting…";return;}if(lastFetch){const s=Math.round((Date.now()-lastFetch)/1000);u.textContent=s<8?"updated just now":"updated "+s+"s ago";}}

let ci=0;
function cycleCam(){const c=P.cameras[ci%P.cameras.length];ci++;
  document.getElementById("camImg").src=CAM_BASE+encodeURIComponent(c.file)+"&t="+Date.now();
  document.getElementById("camCap").innerHTML=`${c.name} <span class="mi">· MP ${c.mp} · ${Math.round(Math.abs(c.mp-P.mile))} mi ${c.mp<P.mile?P.dec.name[0]:P.inc.name[0]}</span>`;}
// ADOT/ODOT serve a 540x330 "no live feed" card for dark cameras. Skip it, but
// stop after one full lap so an all-dark corridor doesn't loop forever.
let _dead=0;document.getElementById("camImg").addEventListener("load",e=>{const i=e.target;if(i.naturalWidth===540&&i.naturalHeight===330){if(++_dead<P.cameras.length)cycleCam();}else _dead=0;});
cycleCam(); setInterval(cycleCam,6000);

// rotating sponsor ad
let adi=0;
function renderAd(){const a=P.services[adi%P.services.length];adi++;const b=document.getElementById("adBanner");
  b.innerHTML="";const nm=document.createElement("span");nm.className="anm";const bb=document.createElement("b");bb.textContent=a.name;nm.appendChild(bb);
  const hs=document.createElement("span");hs.textContent=a.headline;nm.appendChild(hs);b.appendChild(nm);
  const tg=document.createElement("span");tg.className="adtag";tg.textContent=a.house?"IN THE STORE":(a.demo?"SPONSOR · DEMO":"SPONSOR");if(a.house)tg.style.background="#17150f";b.appendChild(tg);
  if(a.url){const q=document.createElement("img");q.className="aq";q.alt="";q.src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data="+encodeURIComponent(a.url);b.appendChild(q);}}
renderAd(); setInterval(renderAd,10000);

// live sports ticker (ESPN, keyless — MLB in season)
async function loadScores(){
  try{
    const d=await fetch("https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard",{cache:"no-store"}).then(r=>r.json());
    const games=(d.events||[]).map(g=>{const c=(g.competitions&&g.competitions[0]&&g.competitions[0].competitors)||[];if(c.length<2)return null;
      const away=c.find(x=>x.homeAway==="away")||c[1],home=c.find(x=>x.homeAway==="home")||c[0];
      const st=(g.status&&g.status.type&&g.status.type.shortDetail)||"";
      return `${away.team.abbreviation} ${away.score}–${home.score} ${home.team.abbreviation} · ${st}`;}).filter(Boolean);
    const txt=games.length?games.join("       "):"Live cameras & DOT alerts along "+P.route+" · updated every minute";
    document.getElementById("tkScroll").innerHTML=(txt+"       ·       ").repeat(2);
    document.getElementById("tkLbl").textContent=games.length?"⚾ SCORES":"● LIVE";
  }catch(e){}
}
loadScores(); setInterval(loadScores,120000);

poll(); setInterval(poll,60000); setInterval(tick,1000);
</script>
</body>
</html>
