<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>MileCheck — Ballard Bridge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* A bar at night is a different room than a gas station at noon, so this board
     leaves the warm-paper system behind: deep harbour night, cream steelwork,
     sodium-lamp amber. Maritime enamel sign, not a dashboard. */
  :root{
    --sea:#0b1f28; --sea2:#123039; --deck:#e8e0cf; --steel:#c9bda6;
    --amber:#f0a83c; --lamp:#ffd489; --red:#e0512c; --go:#4fbf8b;
    --ink:#0b1f28; --dim:#7d8f96;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;color:var(--deck);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;
    container-type:inline-size;position:relative;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 8%, #1b414d 0%, var(--sea2) 42%, var(--sea) 100%)}

  /* ---- header ---- */
  header{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;
    gap:1.1cqw;padding:1.7cqw 2.2cqw}
  .host{font-size:2cqw;font-weight:800;line-height:1.05}
  .pow{font-size:1.05cqw;font-weight:600;color:var(--dim);letter-spacing:.02em}
  .spacer{margin-left:auto;display:flex;align-items:flex-end;gap:1.8cqw}
  .clock{font-size:2cqw;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
  .clock small{display:block;font-size:1cqw;font-weight:700;color:var(--dim);margin-top:.25cqw}

  /* ---- the verdict, set into the sky ---- */
  .verdict{position:absolute;top:11.5%;left:0;right:0;z-index:5;text-align:center;pointer-events:none}
  .vword{font-size:8.6cqw;font-weight:800;line-height:.84;letter-spacing:-.045em;
    transition:color .6s ease;text-shadow:0 .4cqw 2.4cqw rgba(6,18,24,.75)}
  .vword.up{color:var(--red)} .vword.dn{color:var(--go)}
  .vsub{font-size:1.8cqw;font-weight:700;color:var(--deck);opacity:.8;margin-top:.5cqw;
    text-shadow:0 .2cqw 1.2cqw rgba(6,18,24,.8)}

  /* ---- bridge ---- */
  svg#bridge{position:absolute;inset:0;width:100%;height:100%;z-index:2}
  /* the two bascule leaves pivot at the piers, exactly as the real one does */
  #leafL,#leafR{transition:transform 5.5s cubic-bezier(.45,.05,.35,1)}
  #leafL{transform-origin:404px 396px}
  #leafR{transform-origin:796px 396px}
  #stage.raised #leafL{transform:rotate(-62deg)}
  #stage.raised #leafR{transform:rotate(62deg)}
  /* sodium lamps warm up when it's down and traffic is moving */
  .lamp{transition:opacity 1.2s ease}
  #stage.raised .lamp{opacity:.35}
  /* the boat only exists when the bridge is up for it */
  #boat{opacity:0;transition:opacity 1s ease}
  #stage.raised #boat{opacity:1;animation:sail 26s linear infinite}
  @keyframes sail{from{transform:translateX(-360px)}to{transform:translateX(1560px)}}
  /* cars only when the deck is joined */
  #cars{transition:opacity .8s ease}
  #stage.raised #cars{opacity:0}
  .car{animation:drive 9s linear infinite}
  .car:nth-child(2){animation-duration:11s;animation-delay:-4s}
  .car:nth-child(3){animation-duration:7.5s;animation-delay:-6s}
  @keyframes drive{from{transform:translateX(-90px)}to{transform:translateX(1290px)}}
  @media (prefers-reduced-motion:reduce){
    #boat,.car{animation:none}
    #leafL,#leafR{transition:none}
  }

  /* ---- split-flap counter ---- */
  .counter{position:absolute;bottom:8.5cqw;left:2.2cqw;z-index:6;display:flex;align-items:flex-end;gap:1cqw}
  .flap{background:#0a171d;border:1px solid rgba(232,224,207,.22);border-radius:.4cqw;
    padding:.7cqw 1.1cqw;box-shadow:inset 0 -.35cqw 0 rgba(0,0,0,.45);
    font-size:4.6cqw;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
    color:var(--lamp);position:relative}
  .flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.5)}
  .clabel{font-size:1.25cqw;font-weight:700;color:var(--dim);line-height:1.35;max-width:22cqw;
    padding-bottom:.5cqw}
  .clabel b{color:var(--deck);display:block;font-weight:800}

  /* ---- right rail: other bridges, as small lamps ---- */
  /* Three real columns — name, clock, lamp — so the lamps and the durations
     line up down the rail instead of each row drifting to its own width. */
  .rail{position:absolute;right:2.2cqw;bottom:8.5cqw;z-index:6;
    display:grid;grid-template-columns:auto auto min-content;
    column-gap:1.2cqw;row-gap:1.05cqw;align-items:center;font-size:2.1cqw}
  .rlab{grid-column:1/-1;justify-self:end;font-size:1.25cqw;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:.45cqw}
  .br{display:contents}
  .br>span{justify-self:end;font-weight:800;letter-spacing:-.015em}
  .br em{justify-self:end;font-style:normal;font-weight:700;font-size:.66em;
    color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .br.up>span{color:var(--red)}
  .br.up em{color:var(--red);opacity:.85}
  .br i{width:1.2cqw;height:1.2cqw;border-radius:50%;background:var(--go);display:block;
    box-shadow:0 0 1.2cqw rgba(79,191,139,.6)}
  .br.up i{background:var(--red);box-shadow:0 0 1.2cqw rgba(224,81,44,.75)}

  /* ---- footer ---- */
  footer{position:absolute;bottom:0;left:0;right:0;z-index:7;display:flex;align-items:stretch;
    background:#0a171d;border-top:1px solid rgba(240,168,60,.4)}
  .ad{flex:1;display:flex;align-items:center;gap:1.2cqw;padding:1.1cqw 2.2cqw;min-width:0}
  .adtag{flex:none;font-size:1cqw;font-weight:800;letter-spacing:.13em;background:var(--amber);
    color:#0a171d;padding:.35cqw .9cqw;border-radius:.25cqw}
  .adtxt{font-size:1.7cqw;font-weight:700;color:var(--lamp);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .qr{flex:none;display:flex;align-items:center;gap:.9cqw;padding:.7cqw 2.2cqw .7cqw 1.4cqw;
    border-left:1px solid rgba(240,168,60,.3)}
  .qr svg{width:5cqw;height:5cqw;display:block;shape-rendering:crispEdges;background:#fff;padding:.7cqw;border-radius:.25cqw;box-shadow:0 0 0 .1cqw rgba(0,0,0,.06)}
  .qrtx{font-size:1.15cqw;font-weight:800;color:var(--lamp);line-height:1.3}
  .qrtx small{display:block;font-weight:700;color:var(--dim);font-size:1cqw}
</style>

<div id="stage">
  <header>
    <div>
      <div class="host">The Ballard Tavern</div>
      <div class="pow">powered by MileCheck</div>
    </div>
    <div class="spacer">
      <div class="clock"><span id="clock">--:--</span><small id="dateline">&nbsp;</small></div>
    </div>
  </header>

  <div class="verdict">
    <div class="vword dn" id="vword">GO</div>
    <div class="vsub" id="vsub">Ballard Bridge is down. Clear to cross.</div>
  </div>

  <!-- 1200x675 canvas; the leaves pivot at the piers like the real bascule -->
  <!-- 1200x675. Deck at y=396 so the sky carries the verdict and the waterline
       sits low; leaves hinge exactly at the pier faces like the real bascule. -->
  <svg id="bridge" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#10303b"/><stop offset="1" stop-color="#061319"/>
      </linearGradient>
      <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d8ceb8"/><stop offset="1" stop-color="#a3977e"/>
      </linearGradient>
    </defs>

    <!-- water -->
    <rect x="0" y="470" width="1200" height="205" fill="url(#water)"/>
    <g opacity=".38" stroke="#2e6373" stroke-width="2">
      <path d="M0 500h1200M0 534h1200M0 572h1200M0 614h1200M0 656h1200"/>
    </g>

    <!-- boat: sails through the open gap -->
    <g id="boat">
      <g>
        <path d="M540 470h122l-18 24h-86z" fill="#17343e" stroke="#3d7382" stroke-width="2.5"/>
        <rect x="580" y="436" width="34" height="34" fill="#1d404c" stroke="#3d7382" stroke-width="2.5"/>
        <rect x="588" y="444" width="18" height="12" fill="var(--lamp)" opacity=".9"/>
        <path d="M597 436V352" stroke="#4e838f" stroke-width="4"/>
        <path d="M597 360l30 26h-30z" fill="#2a5c69"/>
        <circle cx="597" cy="348" r="6" fill="var(--red)"/>
      </g>
    </g>

    <!-- piers -->
    <g fill="#123039" stroke="#2b5a66" stroke-width="3">
      <rect x="330" y="396" width="76" height="180"/>
      <rect x="794" y="396" width="76" height="180"/>
    </g>

    <!-- counterweight towers: clean verticals + a few true horizontals -->
    <g stroke="url(#steel)" stroke-width="6" fill="none" stroke-linecap="square">
      <path d="M336 396V236M400 396V236M336 236h64M336 288h64M336 340h64"/>
      <path d="M800 396V236M864 396V236M800 236h64M800 288h64M800 340h64"/>
    </g>
    <g stroke="#8d8168" stroke-width="3" fill="none" opacity=".8">
      <path d="M336 288l64-52M400 288l-64-52M336 340l64-52M400 340l-64-52"/>
      <path d="M800 288l64-52M864 288l-64-52M800 340l64-52M864 340l-64-52"/>
    </g>

    <!-- fixed approach spans -->
    <g>
      <rect x="0" y="384" width="334" height="14" fill="url(#steel)"/>
      <rect x="866" y="384" width="334" height="14" fill="url(#steel)"/>
      <g stroke="#7d7360" stroke-width="5" opacity=".7">
        <path d="M70 398v66M170 398v66M270 398v66M930 398v66M1030 398v66M1130 398v66"/>
      </g>
    </g>

    <!-- cars, only while the deck is joined -->
    <!-- Traffic reads as vehicles, not pills: body, greenhouse and wheels, all
         driving left-to-right so headlights lead. Three silhouettes so the deck
         looks like a road rather than a repeating pattern. -->
    <g id="cars">
      <!-- sedan -->
      <g class="car">
        <path d="M103 376l4.5-6q1-1.4 2.7-1.4h13.6q1.7 0 2.9 1.3l5.3 6.1z" fill="#2b4a55"/>
        <rect x="91" y="375.5" width="50" height="6.5" rx="2.4" fill="var(--lamp)"/>
        <rect x="137.6" y="377" width="3.4" height="2.2" rx="1.1" fill="#fffbe8"/>
        <circle cx="102" cy="381.6" r="2.8" fill="#14262c"/>
        <circle cx="130" cy="381.6" r="2.8" fill="#14262c"/>
      </g>
      <!-- box van -->
      <g class="car">
        <rect x="91" y="366.5" width="33" height="15.5" rx="1.6" fill="#efe7d6"/>
        <path d="M124 371h9.5q1.6 0 2.6 1.3l3.4 4.4V382H124z" fill="#e2d8c2"/>
        <rect x="126.5" y="372.6" width="7" height="4" rx="1" fill="#2b4a55"/>
        <rect x="136.4" y="377.4" width="3.2" height="2.2" rx="1.1" fill="#fffbe8"/>
        <circle cx="101" cy="381.8" r="3" fill="#14262c"/>
        <circle cx="131" cy="381.8" r="3" fill="#14262c"/>
      </g>
      <!-- pickup -->
      <g class="car">
        <path d="M116 375.5l4-7q1-1.5 2.8-1.5h9.4q1.8 0 2.9 1.4l4.6 7.1z" fill="#2b4a55"/>
        <rect x="91" y="375" width="53" height="7" rx="2.2" fill="var(--amber)"/>
        <rect x="92.5" y="371" width="22" height="4.2" rx="1.2" fill="var(--amber)"/>
        <rect x="140.6" y="376.6" width="3.4" height="2.2" rx="1.1" fill="#fffbe8"/>
        <circle cx="103" cy="381.9" r="3" fill="#14262c"/>
        <circle cx="134" cy="381.9" r="3" fill="#14262c"/>
      </g>
    </g>

    <!-- the two bascule leaves, hinged at the pier faces -->
    <g id="leafL">
      <rect x="404" y="384" width="196" height="14" fill="url(#steel)"/>
      <rect x="404" y="398" width="196" height="6" fill="#8a7f68"/>
      <g stroke="#9c9078" stroke-width="4" opacity=".85">
        <path d="M430 384v-26M480 384v-26M530 384v-26M580 384v-26M430 358h150"/>
      </g>
    </g>
    <g id="leafR">
      <rect x="600" y="384" width="196" height="14" fill="url(#steel)"/>
      <rect x="600" y="398" width="196" height="6" fill="#8a7f68"/>
      <g stroke="#9c9078" stroke-width="4" opacity=".85">
        <path d="M620 384v-26M670 384v-26M720 384v-26M770 384v-26M620 358h150"/>
      </g>
    </g>

    <!-- sodium lamps over the approaches -->
    <g class="lamp">
      <g fill="var(--lamp)" opacity=".95">
        <circle cx="90" cy="360" r="7"/><circle cx="240" cy="360" r="7"/>
        <circle cx="960" cy="360" r="7"/><circle cx="1110" cy="360" r="7"/>
      </g>
      <g fill="var(--lamp)" opacity=".14">
        <circle cx="90" cy="360" r="30"/><circle cx="240" cy="360" r="30"/>
        <circle cx="960" cy="360" r="30"/><circle cx="1110" cy="360" r="30"/>
      </g>
    </g>
  </svg>

  <div class="counter">
    <div class="flap" id="days">0</div>
    <div class="clabel"><b>days</b> since the bridge ruined somebody's night</div>
  </div>

  <div class="rail">
    <div class="rlab">Ship Canal</div>
    <div class="br" id="r-fremont"><span>Fremont</span><em id="d-fremont"></em><i></i></div>
    <div class="br" id="r-university"><span>University</span><em id="d-university"></em><i></i></div>
    <div class="br" id="r-montlake"><span>Montlake</span><em id="d-montlake"></em><i></i></div>
  </div>

  <footer>
    <div class="ad"><span class="adtag">SPONSOR</span><span class="adtxt" id="adtxt">&nbsp;</span></div>
    <div class="qr">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" width="100%" height="100%" class="segno"><path class="qrline" stroke="#17150f" d="M0 0.5h7m1 0h3m1 0h1m1 0h3m1 0h1m3 0h7m-29 1h1m5 0h1m1 0h2m7 0h1m1 0h1m2 0h1m5 0h1m-29 1h1m1 0h3m1 0h1m1 0h1m2 0h1m3 0h2m5 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m2 0h4m3 0h2m2 0h1m1 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m1 0h1m1 0h1m3 0h2m2 0h2m2 0h1m1 0h3m1 0h1m-29 1h1m5 0h1m2 0h1m1 0h2m3 0h2m4 0h1m5 0h1m-29 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-20 1h1m1 0h1m1 0h1m2 0h1m-17 1h1m2 0h7m1 0h3m1 0h4m2 0h1m2 0h1m1 0h3m-28 1h1m2 0h1m4 0h3m1 0h1m1 0h1m1 0h4m2 0h2m1 0h2m-28 1h1m1 0h2m2 0h1m1 0h1m2 0h3m1 0h1m4 0h2m2 0h1m1 0h1m-26 1h1m1 0h3m2 0h2m3 0h1m1 0h3m3 0h1m2 0h2m2 0h1m-25 1h1m1 0h1m2 0h2m1 0h2m1 0h1m2 0h2m2 0h2m4 0h1m-27 1h1m2 0h1m1 0h5m1 0h5m4 0h7m-29 1h1m1 0h2m2 0h2m2 0h1m2 0h1m1 0h1m1 0h1m1 0h1m1 0h1m2 0h1m1 0h1m1 0h1m-26 1h1m1 0h1m1 0h1m8 0h1m3 0h1m1 0h2m2 0h1m1 0h1m-26 1h1m1 0h2m1 0h1m2 0h1m2 0h2m7 0h1m1 0h1m-26 1h2m2 0h1m5 0h6m1 0h1m1 0h2m3 0h1m1 0h2m-28 1h3m2 0h3m1 0h1m1 0h1m3 0h2m2 0h1m2 0h1m1 0h2m2 0h1m-29 1h2m1 0h1m3 0h3m1 0h1m2 0h1m1 0h1m1 0h4m3 0h2m-27 1h2m1 0h4m1 0h1m2 0h1m1 0h2m1 0h12m-20 1h1m1 0h1m1 0h1m1 0h2m1 0h1m2 0h1m3 0h2m-26 1h7m1 0h1m1 0h2m2 0h2m1 0h1m1 0h2m1 0h1m1 0h2m-26 1h1m5 0h1m1 0h1m1 0h1m3 0h1m2 0h1m1 0h2m3 0h1m2 0h1m-28 1h1m1 0h3m1 0h1m1 0h2m3 0h2m1 0h1m2 0h7m1 0h2m-29 1h1m1 0h3m1 0h1m1 0h1m1 0h4m1 0h2m1 0h1m2 0h1m6 0h1m-29 1h1m1 0h3m1 0h1m2 0h1m1 0h1m2 0h2m1 0h5m1 0h2m1 0h3m-29 1h1m5 0h1m2 0h5m2 0h1m1 0h1m3 0h5m1 0h1m-29 1h7m1 0h1m1 0h3m1 0h2m3 0h2m1 0h1"/></svg>

      <div class="qrtx">Get pinged when<br>it goes up<small>Scan &middot; free app</small></div>
    </div>
  </footer>
</div>

<script>
const API='https://milepost-proxy.leahgerber93.workers.dev';
const REFRESH=30*1000;
const HOME='WA-bridge-ballard';
const OTHERS=[['r-fremont','WA-bridge-fremont','Fremont'],
              ['r-university','WA-bridge-university','University'],
              ['r-montlake','WA-bridge-montlake','Montlake']];
const ADS=[
  "Bridge up? Happy hour runs till it drops. — The Ballard Tavern",
  'Reuben’s Brews — on tap here, brewed six blocks away',
  'Ballard Farmers Market — Sundays, 9 to 2, two blocks over',
];
const $=id=>document.getElementById(id);
const stage=$('stage');

function tick(){const d=new Date();
  $('clock').textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  $('dateline').textContent=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
setInterval(tick,1000);tick();

let ai=-1;
function nextAd(){ai=(ai+1)%ADS.length;$('adtxt').textContent=ADS[ai];}
nextAd();setInterval(nextAd,20000);

// ?up=1 forces the raised state so the motion can be demoed without waiting for
// a real lift (bridges are down ~95% of the time).
const forceUp=new URLSearchParams(location.search).get('up')==='1';

function daysSince(sec){
  if(!sec) return null;
  const d=Math.floor((Date.now()/1000-sec)/86400);
  return d>=0&&d<3650?d:null;
}

// Elapsed time, read from across a room. Minutes while it matters most (a lift
// runs about 7), then h/m, then days once nothing has happened in a while.
function dur(sec){
  if(!sec) return null;
  const s=Math.floor(Date.now()/1000-sec);
  if(s<0||s>3650*86400) return null;
  const m=Math.floor(s/60);
  if(m<1)   return 'just now';
  if(m<60)  return m+' min';
  const h=Math.floor(m/60), rm=m%60;
  if(h<24)  return rm?`${h}h ${rm}m`:`${h}h`;
  const d=Math.floor(h/24);
  return d===1?'1 day':`${d} days`;
}

async function load(){
  let s={raised:[],raisedAt:{},loweredAt:{}};
  try{ s=await fetch(API+'/bridge-status').then(r=>r.json()); }catch(e){}
  const raised=new Set(s.raised||[]);
  const up=forceUp||raised.has(HOME);

  stage.classList.toggle('raised',up);
  const w=$('vword'), sub=$('vsub');
  if(up){
    w.textContent='STAY'; w.className='vword up';
    const t=dur(s.raisedAt&&s.raisedAt[HOME]);
    sub.textContent=t
      ? `Up ${t}. A lift usually runs about 7. Order another.`
      : 'Ballard Bridge is up. Order another.';
  }else{
    w.textContent='GO'; w.className='vword dn';
    const t=dur(s.loweredAt&&s.loweredAt[HOME]);
    sub.textContent=t
      ? `Down ${t} since the last lift. Clear to cross.`
      : 'Ballard Bridge is down. Clear to cross.';
  }

  // The counter resets to 0 the moment it opens — the safety-sign gag.
  const d=up?0:daysSince(s.loweredAt&&s.loweredAt[HOME]);
  $('days').textContent=d==null?'0':d;

  OTHERS.forEach(([id,bid])=>{
    const el=$(id); const o=raised.has(bid);
    el.className='br'+(o?' up':'');
    // Each neighbour carries its own clock: how long it has been up, or how
    // long since it last came down. Named state, because a bare "9 min" on a
    // wall doesn't say nine minutes of what.
    const t=dur(o?(s.raisedAt&&s.raisedAt[bid]):(s.loweredAt&&s.loweredAt[bid]));
    $('d'+id.slice(1)).textContent=t?`${o?'up':'down'} ${t}`:'';
  });
}
load();setInterval(load,REFRESH);
</script>
</html>
