# Weekly: rebuild /gas-prices/ after EIA's Monday survey is published (usually Monday evening or Tuesday ET).
name: gas-prices
on:
  schedule:
    - cron: '30 15 * * 2'
    - cron: '30 15 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency: gas-prices
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/gen-gas-prices.mjs
      - run: node scripts/finish-pages.mjs --pages-only
      - name: Commit if changed
        run: |
          git config user.name "milecheck-bot"
          git config user.email "info@milecheckapp.com"
          git add gas-prices data/gas-prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Gas prices: EIA weekly update $(date -u +%Y-%m-%d)"
          git stash --include-untracked --quiet || true
          git pull --rebase origin main && git push origin HEAD:main
