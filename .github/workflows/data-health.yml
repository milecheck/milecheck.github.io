# Daily: check that every state's camera and alert feeds still return data.
# Pages can load fine while one state's cameras go empty. This goes red (GitHub emails the repo owner) when that happens.
name: data-health
on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency: data-health
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check camera and alert data per state
        run: node scripts/check-data-health.mjs
