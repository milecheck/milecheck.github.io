# Daily: check that every state's camera and alert feeds still return data.
# Pages can load fine while one state's cameras go empty. This goes red (GitHub emails the repo owner) when that happens.
name: data-health
on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency: data-health
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # History of daily counts for the 7-day average check. Kept in the Actions cache, never committed.
      - uses: actions/cache/restore@v4
        with:
          path: .data-health-history.json
          key: data-health-history-${{ github.run_id }}
          restore-keys: data-health-history-
      - name: Check camera and alert data per state
        id: check
        run: node scripts/check-data-health.mjs
      # Mediavine: the ad script is on the pages it should be, and /ads.txt still carries
      # Mediavine's seller line. Red here means re-copy ads.txt from the dashboard or re-run finish-pages.
      - name: Check Mediavine script and ads.txt on the live site
        if: always()
        run: node scripts/check-mediavine.mjs --live
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .data-health-history.json
          key: data-health-history-${{ github.run_id }}
