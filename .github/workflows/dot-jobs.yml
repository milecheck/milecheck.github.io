# Every 6 hours: re-read the open DOT job postings (Oregon Workday JSON, MnDOT openings page), rebuild /dot-jobs/, commit if changed.
name: dot-jobs
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: dot-jobs
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: gen
        run: node scripts/gen-dot-jobs.mjs
        env: { SKIP_OR: '1' }
        continue-on-error: true
      - run: node scripts/finish-pages.mjs --pages-only
      - name: Commit if changed
        run: |
          git config user.name "milecheck-bot"
          git config user.email "info@milecheckapp.com"
          git add data/dot-jobs.json dot-jobs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "DOT jobs refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git stash --include-untracked --quiet || true
          git pull --rebase origin main && git push origin HEAD:main
      - name: Fail loudly if a source broke
        if: steps.gen.outcome == 'failure'
        run: echo 'A DOT jobs source failed or its layout changed. See the gen step log.' && exit 1
