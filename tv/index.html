<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MileCheck board setup</title>
<!-- Short TV setup (2026-10-15). Staff type milecheckapp.com/tv and their 4-digit store code.
     The TV remembers it, so after a power cut milecheckapp.com/tv goes straight to the board.
     Plain ES5 on purpose: older Samsung/LG/Fire TV browsers must run it. Codes: codes.js
     (generated by scripts/gen-venue-store-kit.py). -->
<style>
  html,body{margin:0;height:100%;background:#f3f1e8;color:#14140f;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw;box-sizing:border-box}
  h1{font-size:6vh;margin:0 0 2vh}
  p{font-size:3vh;margin:0 0 3vh;color:#5d584d}
  input{font-size:9vh;width:4.6em;text-align:center;letter-spacing:.25em;padding:1vh 2vh;border:4px solid #14140f;border-radius:1.5vh;background:#fff}
  button{font-size:4vh;margin-top:3vh;padding:1.5vh 5vh;border:0;border-radius:1.5vh;background:#0f7a4f;color:#fff;font-weight:700}
  .err{color:#cf3320;font-weight:700;min-height:4vh;font-size:3vh;margin-top:2vh}
  .small{font-size:2.4vh;margin-top:4vh}
  a{color:#0f7a4f}
  /* spon:css */
    .spon{display:flex;align-items:center;gap:12px;min-height:74px;margin:0 0 12px;padding:12px 16px;border:1px solid #E5E5E5;border-radius:12px;background:#fff;box-sizing:border-box;width:100%;max-width:100%;flex-shrink:0;align-self:stretch;grid-column:1/-1;}
    .spon-tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#5b6670;border:1px solid #E5E5E5;border-radius:6px;padding:3px 7px;line-height:1.3;}
    .spon-body{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none;color:#0E1116;}
    .spon-logo{flex:none;height:36px;width:auto;max-width:132px;object-fit:contain;}
    .spon-text{flex:1;min-width:0;font-size:14.5px;line-height:1.35;color:#3a444d;}
    .spon-text strong{color:#0E1116;font-weight:800;}
    .spon-house{background:linear-gradient(90deg,#f3f7f4,#fff 45%);border-color:#cfe3d7;}
    .spon.spon-house{min-height:96px;padding:8px 16px 8px 12px;}
    .spon-roy{flex:none;height:80px;width:auto;margin:0;align-self:center;}
    .spon-house .spon-text{color:#1f3b2d;}
    .spon-house .spon-text strong{color:#0f7a4f;}
    .spon-logo-ph{display:inline-flex;align-items:center;justify-content:center;width:96px;height:36px;border:1px dashed #b9c0c7;border-radius:6px;font-size:11px;color:#5b6670;background:#f6f7f8;}
    .spon-preview{flex:none;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#0f7a4f;border-radius:6px;padding:3px 7px;}
    .spon-cta{flex:none;font-size:13.5px;font-weight:700;color:#0f7a4f;white-space:nowrap;}
    .spon-body:hover .spon-cta{text-decoration:underline;}
    @media(max-width:600px){ .spon.spon-house{flex-wrap:nowrap;align-items:center;gap:10px;padding:10px 12px;min-height:0;} .spon-roy{height:62px;margin:0;align-self:center;} .spon.spon-house .spon-body{flex:1 1 auto;flex-basis:auto;flex-direction:column;align-items:flex-start;gap:3px;flex-wrap:nowrap;} .spon-house .spon-text{font-size:13.5px;} .spon-house .spon-cta{margin-left:0;} .spon{flex-wrap:wrap;gap:8px 12px;padding:12px 14px;min-height:56px;} .spon-body{flex-basis:100%;flex-wrap:wrap;} .spon-text{flex:1 1 60%;} .spon-cta{margin-left:auto;} }
/* /spon:css */
  </style>
</head>
<body>
<div class="wrap" id="wrap">
  <!-- spon:start -->
  <aside class="spon spon-house" id="spon" data-slot="basics:tv" data-sponsor="house" aria-label="Sponsor">
    <img class="spon-roy" src="/images/sponsors/roy-sponsor.png" width="276" height="235" alt="" loading="lazy" decoding="async">
    <a class="spon-body" href="/sponsor/" data-spon-link>
      <span class="spon-text"><strong>Want to advertise with us?</strong></span>
      <span class="spon-cta">Learn more →</span>
    </a>
  </aside>
<!-- spon:end -->
<h1>MileCheck road board</h1>
  <p id="lead">Type your 4-digit store code, then press Go.</p>
  <form id="f"><input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" autofocus><br><button type="submit">Go</button></form>
  <div class="err" id="err"></div>
  <p class="small">No code? Email sales@milecheckapp.com</p>
</div>
<script src="codes.js"></script>
<script>document.write('<script src="access.js?v='+Date.now()+'"><\/script>');</script>
<script>
(function(){
  var KEY = 'mcTvCode';
  function store(v){ try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }
  function saved(){ try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function go(code){
    var c = (window.TV_CODES || {})[code];
    if (!c) { document.getElementById('err').innerHTML = 'That code isn’t right. Check it and try again.'; store(null); return false; }
    // Test links last 24 hours (tv/access.js, set by scripts/tv-access.py). Signed stores never expire.
    var a = (window.TV_ACCESS || {})[code], extra = '';
    if (a && a.signed) extra = '';
    else if (a && a.until > new Date().getTime()) extra = '&until=' + a.until;
    else { document.getElementById('err').innerHTML = 'This code isn’t active. Email sales@milecheckapp.com to turn it on.'; return false; }
    store(code);
    location.href = '/boards/' + c.board + '?' + c.q + extra;
    return true;
  }
  var q = location.search.match(/[?&]c=(\d{4})/);
  var change = /[?&]change=1/.test(location.search);
  if (change) store(null);
  if (/[?&]expired=1/.test(location.search)) document.getElementById('err').innerHTML = 'The 24-hour test has ended. Email sales@milecheckapp.com to keep the board.';
  var s = q ? q[1] : ((change || /[?&]expired=1/.test(location.search)) ? null : saved());
  if (s && window.TV_CODES && window.TV_CODES[s]) {
    // Remembered store: say where we're going, give 4 seconds to change it with the remote.
    document.getElementById('lead').innerHTML = 'Opening the board for <b>' + window.TV_CODES[s].store.replace(/</g,'&lt;') + '</b>…';
    document.getElementById('err').innerHTML = '<a href="?change=1">Different store? Change it</a>';
    setTimeout(function(){ go(s); }, 4000);
  }
  document.getElementById('f').onsubmit = function(e){ e.preventDefault(); go((document.getElementById('code').value || '').replace(/\D/g,'')); };
})();
</script>
<!-- spon:start --><script>(function(){var el=document.getElementById('spon');if(!el)return;var q=new URLSearchParams(location.search);if(q.get('sponsor')==='preview'){var nm=(q.get('name')||'Your company').slice(0,60),cp=(q.get('copy')||'One sentence about what you do for the drivers on this page.').slice(0,120),ct=(q.get('cta')||'Your link').slice(0,30);el.setAttribute('data-sponsor','preview');el.innerHTML='';var tg=document.createElement('span');tg.className='spon-tag';tg.textContent='Sponsor';var a=document.createElement('a');a.className='spon-body';a.href='#';a.addEventListener('click',function(ev){ev.preventDefault();});var lg=document.createElement('span');lg.className='spon-logo spon-logo-ph';lg.textContent='Your logo';var tx=document.createElement('span');tx.className='spon-text';var st=document.createElement('strong');st.textContent=nm;tx.appendChild(st);tx.appendChild(document.createTextNode(' '+cp));var c=document.createElement('span');c.className='spon-cta';c.textContent=ct+' →';a.appendChild(lg);a.appendChild(tx);a.appendChild(c);el.appendChild(tg);el.appendChild(a);var pv=document.createElement('span');pv.className='spon-preview';pv.textContent='Preview';el.appendChild(pv);return;}if(navigator.webdriver)return;var B="https://api.milecheckapp.com/sponsor-beacon",S=el.getAttribute('data-slot'),A=el.getAttribute('data-sponsor'),P=location.pathname;function send(e){var u=B+'?e='+e+'&s='+encodeURIComponent(S)+'&a='+encodeURIComponent(A)+'&p='+encodeURIComponent(P);try{if(navigator.sendBeacon)navigator.sendBeacon(u);else fetch(u,{method:'POST',keepalive:true}).catch(function(){});}catch(x){}}var done=false,t=null,inView=false,io=null;function arm(){if(done||t||!inView||document.visibilityState!=='visible')return;t=setTimeout(function(){t=null;if(done||!inView||document.visibilityState!=='visible')return;done=true;if(io)io.disconnect();send('imp');},1000);}function disarm(){if(t){clearTimeout(t);t=null;}}if('IntersectionObserver' in window){io=new IntersectionObserver(function(en){en.forEach(function(x){inView=x.isIntersecting&&x.intersectionRatio>=0.5;if(inView)arm();else disarm();});},{threshold:[0,0.5,1]});io.observe(el);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')arm();else disarm();});}var a=el.querySelector('[data-spon-link]');if(a){a.addEventListener('click',function(){send('click');});a.addEventListener('auxclick',function(ev){if(ev.button===1)send('click');});}})();</script><!-- spon:end -->
</body>
</html>
