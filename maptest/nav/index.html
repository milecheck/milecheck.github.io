const FL=[['alerts','Road alerts','#f59e0b',1],['closures','Closures and crashes','#dc2626',1],['weather','Road weather','#3b82f6',1],['cams','Traffic cameras','#0f766e',0],['plows','Snowplows','#ea580c',1],
 ['mp','Mile markers','#475569',1],['fuel','EV chargers and fuel','#7c3aed',1],['lanes','Lane lines','#9aa0a0',1],['towns','Town names','#16201b',1],['lakes','Lake and water names','#2b6a99',1],
 ['county','County lines','#9aa79f',1],['city','City limits','#00875f',1],['shade','Terrain shading','#bbb',1]];
const LAY={mp:['mp','mpl'],fuel:['fuel','fuell'],lanes:['lnr','lne','lnl','lnc'],towns:['place'],lakes:['wlab'],county:['countyf','county','countyn'],city:['city'],shade:['hs'],alerts:['lv-alerts'],closures:['lv-clos'],weather:['lv-wx'],cams:['lv-cams'],plows:['lv-plows']};
let ON={};try{ON=JSON.parse(localStorage.getItem('mcNavFilters')||'{}')}catch(e){}
FL.forEach(f=>{if(!(f[0] in ON))ON[f[0]]=!!f[3]});
$('flt').innerHTML=FL.map(f=>'<label><input type="checkbox" data-f="'+f[0]+'"'+(ON[f[0]]?' checked':'')+'><span class="sw" style="background:'+f[2]+'"></span>'+f[1]+'</label>').join('');
$('flt').addEventListener('change',e=>{const k=e.target.dataset.f;ON[k]=e.target.checked;try{localStorage.setItem('mcNavFilters',JSON.stringify(ON))}catch(x){}applyF();if(ON[k])loadLive()});
$('layp').addEventListener('click',e=>e.stopPropagation());
function applyF(){for(const k in LAY)for(const id of LAY[k])if(map.getLayer(id))map.setLayoutProperty(id,'visibility',ON[k]?'visible':'none')}
const LIVE={alerts:{type:'FeatureCollection',features:[]},clos:{type:'FeatureCollection',features:[]},wx:{type:'FeatureCollection',features:[]},cams:{type:'FeatureCollection',features:[]},plows:{type:'FeatureCollection',features:[]}};const got={};
function addLive(){const add=(id,src,paint)=>{if(!map.getSource(src))map.addSource(src,{type:'geojson',data:LIVE[src.slice(3)]});if(!map.getLayer(id))map.addLayer({id,type:'circle',source:src,paint},map.getLayer('rc')?'rc':undefined)};
 add('lv-wx','lv-wx',{'circle-radius':5,'circle-color':'#3b82f6','circle-stroke-color':'#fff','circle-stroke-width':1.5});
 add('lv-alerts','lv-alerts',{'circle-radius':5.5,'circle-color':'#f59e0b','circle-stroke-color':'#fff','circle-stroke-width':1.5});
 add('lv-clos','lv-clos',{'circle-radius':6.5,'circle-color':'#dc2626','circle-stroke-color':'#fff','circle-stroke-width':2});
 add('lv-cams','lv-cams',{'circle-radius':['interpolate',['linear'],['zoom'],8,2.5,13,5],'circle-color':'#0f766e','circle-stroke-color':'#fff','circle-stroke-width':1});
 add('lv-plows','lv-plows',{'circle-radius':5,'circle-color':'#ea580c','circle-stroke-color':'#fff','circle-stroke-width':1.5});applyF()}
const txt=h=>String(h||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
async function loadLive(){const S=st.toUpperCase();if(got[S])return;got[S]=1;const j=p=>fetch(API+p,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
 const [inc,con,cam,plw]=await Promise.all([j('/incidents?state='+S),j('/conditions?state='+S),j('/cameras?state='+S),j('/plows?state='+S)]);
 for(const x of (inc&&inc['incident-reports'])||[]){const l=x.location||{},s=l['start-location']||{},la=+s['start-lat'],lo=+s['start-long'];if(!la||!lo)continue;const t=x['event-type-id'],clos=t==='CL'||t==='AC';
  (clos?LIVE.clos:LIVE.alerts).features.push({type:'Feature',properties:{t:clos?(t==='AC'?'Crash':'Closure'):(t==='RW'?'Construction':t==='WE'?'Weather':'Alert'),r:l['route-id']||'',d:txt(x.headline||x['impact-desc']||x.description).slice(0,220)},geometry:{type:'Point',coordinates:[lo,la]}})}
 for(const x of (con&&con['road-weather-reports'])||[]){const la=+x.latitude,lo=+x.longitude;if(!la||!lo)continue;LIVE.wx.features.push({type:'Feature',properties:{t:'Road weather',r:x['location-name']||'',d:txt([x['road-surface-condition'],x['weather-condition'],x['air-temperature']!=null?x['air-temperature']+'°F':''].filter(Boolean).join(' · '))},geometry:{type:'Point',coordinates:[lo,la]}})}
 for(const x of (cam&&cam.cameras)||[]){if(!x.lat||!x.lon||x.isActive===false)continue;LIVE.cams.features.push({type:'Feature',properties:{t:'Camera',r:x.title||'',img:x.imageUrl||''},geometry:{type:'Point',coordinates:[x.lon,x.lat]}})}
 for(const x of (plw&&plw.plows)||[]){if(!x.lat||!x.lon)continue;LIVE.plows.features.push({type:'Feature',properties:{t:'Snowplow, last reported',r:x.route||'',d:x.time||x.updated||''},geometry:{type:'Point',coordinates:[x.lon,x.lat]}})}
 for(const k in LIVE){const sid='lv-'+k;if(map.getSource(sid))map.getSource(sid).setData(LIVE[k])}}
map.on('styledata',()=>{if(map.isStyleLoaded()){addLive();}});map.on('load',()=>{addLive();loadLive()});
map.on('idle',()=>{if(!map.getLayer('lv-alerts'))addLive();loadLive()});
map.on('click',e=>{if(nav)return;const ids=['lv-cams','lv-clos','lv-alerts','lv-wx','lv-plows','fuel','mp'].filter(i=>map.getLayer(i)&&map.getLayoutProperty(i,'visibility')!=='none');
 const fs=map.queryRenderedFeatures([[e.point.x-8,e.point.y-8],[e.point.x+8,e.point.y+8]],{layers:ids});if(!fs.length)return;const f=fs[0],q=f.properties;const esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
 let h;if(f.layer.id==='lv-cams')h='<b>'+esc(q.r)+'</b><br><img src="'+esc(q.img)+'" alt="" style="width:240px;max-width:70vw;border-radius:6px;margin-top:6px">';
 else if(f.layer.id==='mp')h='<b>Mile marker '+esc(q.mp)+'</b><br>'+esc(q.r);
 else if(f.layer.id==='fuel')h='<b>'+({EVF:'DC fast charger',EV:'EV charger (Level 2)'}[q.t]||'Alternative fuel')+'</b><br>'+esc(q.n)+'<br><small>'+esc(q.d)+'</small>';
 else h='<b>'+esc(q.t)+(q.r?' · '+esc(q.r):'')+'</b><br><small>'+esc(q.d)+'</small>';
 new maplibregl.Popup({maxWidth:'280px'}).setLngLat(f.geometry.coordinates).setHTML(h).addTo(map);e.preventDefault&&e.preventDefault()});
// ---- navigation ----
let nav=null,mpLast=0;
function stopNav(){if(nav){cancelAnimationFrame(nav.raf);nav=null}$('banner').style.display=$('foot').style.display=$('mm').style.display='none';$('top').style.display='';$('lay').style.display=$('loc').style.display='';$('lay').style.top='';$('lay').style.bottom='';if(R)$('routeC').style.display='block';map.easeTo({pitch:0,bearing:0,duration:500})}
$('end').onclick=stopNav;
$('go').onclick=()=>{if(!R)return;const cum=[0];for(let i=1;i<R.line.length;i++)cum.push(cum[i-1]+hav(R.line[i-1][0],R.line[i-1][1],R.line[i][0],R.line[i][1]));
 nav={said:{},cum,d:0,last:performance.now(),speed:Math.max(60,cum[cum.length-1]/150)};
 $('top').style.display=$('routeC').style.display=$('loc').style.display=$('layp').style.display='none';$('lay').style.top='auto';$('lay').style.bottom='160px';$('banner').style.display='block';$('foot').style.display='flex';$('mm').style.display='none';pts();
 map.easeTo({center:R.line[0],zoom:16,pitch:55,duration:900});setTimeout(()=>{if(nav){nav.last=performance.now();tick()}},950)};
function tick(){if(!nav)return;const now=performance.now(),dt=(now-nav.last)/1000;nav.last=now;nav.d+=nav.speed*dt;const c=nav.cum,L=c[c.length-1];
 if(nav.d>=L){$('nD').textContent='You have arrived';$('nT').textContent=dest?dest.name:'';$('nL').style.display='none';$('fEta').textContent='Arrived';$('fLeft').textContent='';setTimeout(stopNav,3000);nav.raf=0;return}
 let i=1;while(c[i]<nav.d)i++;const f=(nav.d-c[i-1])/Math.max(1e-6,c[i]-c[i-1]),p0=R.line[i-1],p1=R.line[i],pos=[p0[0]+(p1[0]-p0[0])*f,p0[1]+(p1[1]-p0[1])*f];
 let j=i+3;while(j<R.line.length-1&&c[j]-nav.d<120)j++;map.jumpTo({center:pos,bearing:brg(pos,R.line[Math.min(j,R.line.length-1)]),zoom:16,pitch:55});
 map.getSource('pts').setData({type:'FeatureCollection',features:[{type:'Feature',properties:{k:'me'},geometry:{type:'Point',coordinates:pos}},{type:'Feature',properties:{k:'B'},geometry:{type:'Point',coordinates:R.line[R.line.length-1]}}]});
 let s=0;while(s<R.steps.length-1&&R.steps[s+1].at<=i-1)s++;const nx=R.steps[s+1],lane=$('nL');
 if(nx){const dn=c[Math.min(nx.at,c.length-1)]-nav.d;$('nD').textContent=mi(dn);$('nT').textContent=nx.txt;const side=/right/.test(nx.txt)?'right':/left/.test(nx.txt)?'left':null;
  if(nx.name==='ramp'&&dn<3219){lane.style.display='block';lane.textContent=(side?'Move to the '+side+' lane now. ':'Get ready. ')+'Your exit is in '+mi(dn)+'.'}else lane.style.display='none';
  for(const th of [3219,1609,805,250]){if(dn<th&&!(nav.said[s+1]||[]).includes(th)){(nav.said[s+1]=nav.said[s+1]||[]).push(th);if(window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance('In '+mi(dn).replace('mi','miles').replace('ft','feet')+', '+nx.txt))}}}}
 else{$('nD').textContent=mi(L-nav.d);$('nT').textContent='Arrive at '+(dest?dest.name:'your stop');lane.style.display='none'}
 const left=L-nav.d;$('fEta').textContent=hm(R.secs*left/L);$('fLeft').textContent=mi(left)+' to go';
 if(now-mpLast>700){mpLast=now;const pp=map.project(pos);const fs=map.getLayer('mp')?map.queryRenderedFeatures([[pp.x-70,pp.y-70],[pp.x+70,pp.y+70]],{layers:['mp']}):[];
  if(fs.length){let best=fs[0],bd=1e9;for(const qq of fs){const g=qq.geometry.coordinates,dd=hav(g[0],g[1],pos[0],pos[1]);if(dd<bd){bd=dd;best=qq}}$('mm').style.display='block';$('mmN').textContent=best.properties.mp;$('mmR').textContent=String(best.properties.r||'').replace(/^SR (5|82|90|182|205|405|705)$/,'I-$1')}}
 nav.raf=requestAnimationFrame(tick)}
})();
</script></body></html>
