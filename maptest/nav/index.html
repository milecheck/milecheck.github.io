function geomOf(ei,rev){const p=G.p[G.e[ei][5]],c=[];for(let i=0;i<p.length;i+=2)c.push([p[i],p[i+1]]);return rev?c.reverse():c}
const brg=(a,b)=>{const r=Math.PI/180,y=Math.sin((b[0]-a[0])*r)*Math.cos(b[1]*r),x=Math.cos(a[1]*r)*Math.sin(b[1]*r)-Math.sin(a[1]*r)*Math.cos(b[1]*r)*Math.cos((b[0]-a[0])*r);return (Math.atan2(y,x)/r+360)%360};
function build(r){const line=[];const steps=[];let cur=null;
 for(const [ei,rev] of r.edges){const e=G.e[ei],g=geomOf(ei,rev),name=G.s[e[4]]||'',len=e[2];
  const start=line.length;g.forEach((c,i)=>{if(i||!line.length)line.push(c)});
  const key=name==='ramp'?'ramp'+ei:name;
  if(!cur||cur.key!==key||(name===''&&cur.name==='')){if(cur&&cur.key===key){cur.m+=len;continue}
   const turn=cur?((brg(line[Math.max(0,start-1)],line[Math.min(line.length-1,start+1)])-cur.lastBrg+540)%360-180):0;
   cur={key,name,m:len,at:start,turn,cls:e[3]};steps.push(cur)}else cur.m+=len;
  cur.lastBrg=brg(line[Math.max(0,line.length-2)],line[line.length-1])}
 // collapse ramp chains into one "take the ramp to X" step; fold short pieces into neighbors
 const isR=x=>x.name==='ramp';const out=[];
 for(let k=0;k<steps.length;k++){const s=steps[k];
  if(isR(s)){let m=s.m,t=s.turn;while(k+1<steps.length&&isR(steps[k+1])){k++;m+=steps[k].m}
   const nx=steps[k+1];const to=nx&&nx.name&&!isR(nx)?nx.name:null;
   const side=t>20?' on the right':t<-20?' on the left':'';
   if(!out.length){out.push({txt:'Head out on the ramp'+(to?' to '+to:''),m,at:s.at,name:'ramp'});continue}
   out.push({txt:'Take the ramp'+side+(to?' to '+to:''),m,at:s.at,name:'ramp',to});continue}
  const nm=s.name||'the road';const prev=out[out.length-1];
  if(prev&&prev.name==='ramp'&&prev.to===s.name){prev.m+=0;out.push({txt:'Merge onto '+nm,m:s.m,at:s.at,name:s.name,cls:s.cls});continue}
  if(prev&&prev.name===s.name){prev.m+=s.m;continue}
  const rank=n=>/^I-/.test(n)?0:/^US /.test(n)?1:/^SR /.test(n)?2:3;
  if(prev&&prev.cls===0&&s.cls===0&&prev.name!=='ramp'){prev.m+=s.m;if(rank(s.name)<rank(prev.name)){prev.txt=prev.txt.replace(prev.name,s.name);prev.name=s.name}continue}
  if(prev&&prev.name!=='ramp'&&Math.abs(s.turn)<25&&(prev.alias===s.name||(out.length>1&&out[out.length-2].name===s.name&&false))){prev.m+=s.m;continue}
  if(prev&&prev.name!=='ramp'&&Math.abs(s.turn)<25&&k+1<steps.length&&steps[k+1].name===prev.name&&Math.abs(steps[k+1].turn)<25){prev.alias=s.name;if(prev.txt.indexOf('(')<0)prev.txt+=' ('+s.name+')';prev.m+=s.m;continue}
  if(prev&&s.m<120&&k<steps.length-1){prev.m+=s.m;continue}
  const txt=!out.length?'Head out on '+nm:(Math.abs(s.turn)<25?'Continue onto ':s.turn>0?'Turn right onto ':'Turn left onto ')+nm;
  out.push({txt,m:s.m,at:s.at,name:s.name,cls:s.cls})}
 return {line,steps:out}}
const mi=m=>m<160?Math.round(m*3.28084/50)*50+' ft':(m/1609.34).toFixed(m<16093?1:0)+' mi';
const hm=s=>{const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h?h+' h '+m+' min':m+' min'};
// ---- UI ----
let A=null,B=null,R=null,which='A';const $=id=>document.getElementById(id);
function pts(extra){const f=[];if(A)f.push({type:'Feature',properties:{k:'A'},geometry:{type:'Point',coordinates:A}});if(B)f.push({type:'Feature',properties:{k:'B'},geometry:{type:'Point',coordinates:B}});if(extra)f.push(extra);map.getSource('pts')&&map.getSource('pts').setData({type:'FeatureCollection',features:f})}
function setPt(k,c,label){if(k==='A'){A=c;$('pA').textContent=label||'Start: '+c[1].toFixed(4)+', '+c[0].toFixed(4)}else{B=c;$('pB').textContent=label||'Stop: '+c[1].toFixed(4)+', '+c[0].toFixed(4)}pts();plan()}
$('pA').onclick=()=>{which='A';$('pA').classList.add('on');$('pB').classList.remove('on')};$('pB').onclick=()=>{which='B';$('pB').classList.add('on');$('pA').classList.remove('on')};
map.on('click',e=>{if(nav)return;setPt(which,[e.lngLat.lng,e.lngLat.lat]);if(which==='A')$('pB').click()});
async function plan(){R=null;$('bStart').disabled=true;$('steps').innerHTML='';if(!A||!B){$('sum').textContent='';return}
 if(!G){$('sum').textContent='Loading roads...';await loadGraph()}
 const a=nearest(A[0],A[1]),b=nearest(B[0],B[1]);const r=route(a,b);
 if(!r){$('sum').textContent='No route found on highways between those points. Try points nearer a highway.';return}
 R=build(r);R.secs=r.secs;R.m=r.edges.reduce((s,[ei])=>s+G.e[ei][2],0);
 map.getSource('route').setData({type:'Feature',geometry:{type:'LineString',coordinates:R.line}});
 const bb=R.line.reduce((b,c)=>[Math.min(b[0],c[0]),Math.min(b[1],c[1]),Math.max(b[2],c[0]),Math.max(b[3],c[1])],[180,90,-180,-90]);
 map.fitBounds([[bb[0],bb[1]],[bb[2],bb[3]]],{padding:{top:60,bottom:60,left:innerWidth>700?400:40,right:60},duration:600});
 $('sum').textContent=mi(R.m)+' · about '+hm(R.secs)+' at posted-class speeds';
 $('steps').innerHTML=R.steps.map(s=>'<li>'+s.txt+' <span style="color:#5b675f">· '+mi(s.m)+'</span></li>').join('');$('bStart').disabled=false}
function fillTrips(){$('trip').innerHTML='<option value="">Sample trips</option>'+ST[st].trips.map((t,i)=>'<option value="'+i+'">'+t[0]+'</option>').join('')}
$('trip').onchange=()=>{const t=ST[st].trips[+$('trip').value];if(!t)return;A=t[1];$('pA').textContent='Start: '+t[0].split(' to ')[0];setPt('B',t[2],'Stop: '+t[0].split(' to ')[1])};
$('state').value=st;$('state').onchange=()=>{st=$('state').value;history.replaceState(null,'','?state='+st);stopNav();A=B=R=null;G=null;$('pA').textContent='Tap the map for start';$('pB').textContent='Tap the map for stop';$('sum').textContent='';$('steps').innerHTML='';
 map.setStyle(makeStyle());map.jumpTo({center:ST[st].c,zoom:ST[st].z,bearing:0,pitch:0});fillTrips()};
$('bClear').onclick=()=>{A=B=R=null;$('pA').textContent='Tap the map for start';$('pB').textContent='Tap the map for stop';$('sum').textContent='';$('steps').innerHTML='';$('bStart').disabled=true;map.getSource('route').setData({type:'FeatureCollection',features:[]});pts();$('pA').click()};
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('#views button').forEach(x=>x.style.outline=x===b?'2px solid #14532d':'');const keep=R;map.setStyle(makeStyle());map.once('styledata',()=>{if(keep)setTimeout(()=>{map.getSource('route')&&map.getSource('route').setData({type:'Feature',geometry:{type:'LineString',coordinates:keep.line}});pts()},300)})});
fillTrips();
// ---- navigation (simulated drive along the route) ----
let nav=null;
function stopNav(){if(nav){cancelAnimationFrame(nav.raf);nav=null}$('banner').style.display=$('foot').style.display=$('mm').style.display='none';$('plan').style.display='';map.easeTo({pitch:0,bearing:0,duration:500})}
$('bStop').onclick=stopNav;
$('bStart').onclick=()=>{if(!R)return;const cum=[0];for(let i=1;i<R.line.length;i++)cum.push(cum[i-1]+hav(R.line[i-1][0],R.line[i-1][1],R.line[i][0],R.line[i][1]));
 nav={said:{},voice:true,cum,d:0,t0:performance.now(),last:performance.now(),speed:Math.max(250,cum[cum.length-1]/180)};// whole trip plays in about 3 minutes
 $('plan').style.display='none';$('banner').style.display='block';$('foot').style.display='flex';$('mm').style.display='block';
 map.easeTo({center:R.line[0],zoom:15.5,pitch:55,duration:900});setTimeout(tick,950)};
let mpLast=0;
function tick(){if(!nav)return;const now=performance.now(),dt=(now-nav.last)/1000;nav.last=now;nav.d+=nav.speed*dt;const c=nav.cum,L=c[c.length-1];
 if(nav.d>=L){$('nD').textContent='You have arrived';$('nT').textContent='';$('fEta').textContent='0 min';$('fLeft').textContent='';map.easeTo({center:R.line[R.line.length-1],duration:500});nav.raf=0;setTimeout(stopNav,2500);return}
 let i=1;while(c[i]<nav.d)i++;const f=(nav.d-c[i-1])/Math.max(1e-6,c[i]-c[i-1]),p0=R.line[i-1],p1=R.line[i],pos=[p0[0]+(p1[0]-p0[0])*f,p0[1]+(p1[1]-p0[1])*f];
 let j=i+3;while(j<R.line.length-1&&c[j]-nav.d<120)j++;const b=brg(pos,R.line[Math.min(j,R.line.length-1)]);
 map.jumpTo({center:pos,bearing:b,zoom:15.5,pitch:55});pts({type:'Feature',properties:{k:'me'},geometry:{type:'Point',coordinates:pos}});
 let s=0;while(s<R.steps.length-1&&R.steps[s+1].at<=i-1)s++;const nx=R.steps[s+1];
 if(nx){const dn=c[Math.min(nx.at,c.length-1)]-nav.d;$('nD').textContent=mi(dn);$('nT').textContent=nx.txt;
  const side=/right/.test(nx.txt)?'right':/left/.test(nx.txt)?'left':null;const lane=$('nL');
  if(nx.name==='ramp'&&dn<3219){lane.style.display='block';lane.textContent=(side?'Move to the '+side+' lane now. ':'Get ready. ')+'Your exit is in '+mi(dn)+'.'}
  else lane.style.display='none';
  for(const th of [3219,1609,805,250]){if(dn<th&&!(nav.said[s+1]||[]).includes(th)){(nav.said[s+1]=nav.said[s+1]||[]).push(th);if(window.speechSynthesis&&nav.voice){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance('In '+mi(dn).replace('mi','miles').replace('ft','feet')+', '+nx.txt))}}}}
 else{$('nD').textContent=mi(L-nav.d);$('nT').textContent='Arrive at your stop';$('nL').style.display='none'}
 const left=L-nav.d;$('fEta').textContent=hm(R.secs*left/L);$('fLeft').textContent=mi(left)+' to go';
 if(now-mpLast>700){mpLast=now;const pp=map.project(pos);const fs=map.getLayer('mp')?map.queryRenderedFeatures([[pp.x-60,pp.y-60],[pp.x+60,pp.y+60]],{layers:['mp']}):[];
  if(fs.length){let best=fs[0],bd=1e9;for(const q of fs){const g=q.geometry.coordinates,dd=hav(g[0],g[1],pos[0],pos[1]);if(dd<bd){bd=dd;best=q}}$('mmN').textContent=best.properties.mp;$('mmR').textContent=String(best.properties.r||'').replace(/^SR (5|82|90|182|205|405|705)$/,'I-$1')}}
 nav.raf=requestAnimationFrame(tick)}
})();
</script></body></html>
