<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>MileCheck</title>
<style>
  /* ----------------------------------------------------------------
     2026-10-22 redesign: the milepost sign is the hero (same green sign,
     white border, route + one-decimal mile as the phone app), with a small
     map beside it. Cameras and drawbridges sit right under the sign, then
     the alerts. Built to fit one screen at MyGeotab panel width.
  ----------------------------------------------------------------- */
  :root{
    --ink:#161a1f; --muted:#5d6670; --faint:#5f6873; --line:#dce0e6;
    --surface:#fff; --bg:#f1f2f4; --accent:#27496d; --sign:#0b6b3a;
    --crit:#9f2a1f; --warn:#875708; --cool:#3f5a73; --info:#5b6770; --ok:#1d6b46;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  #milecheck{max-width:1280px;margin:0 auto;padding:12px 16px;}
  img{max-width:100%;}

  .mc-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px;}
  .mc-brand{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;}
  .mc-brand i{width:12px;height:12px;border-radius:50%;background:var(--sign);display:inline-block;}
  .mc-vehicle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .mc-vname{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .mc-demo,.mc-live{display:none;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:3px;}
  .mc-demo{color:#6b5000;background:#f5efdb;border:1px solid #e4d8ad;}
  .mc-live{color:var(--ok);background:#e6f1ea;border:1px solid #c2dcce;}
  .mc-demo.on,.mc-live.on{display:inline-block;}
  .mc-live .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px;}
  .mc-veh{display:none;font:inherit;font-size:12px;max-width:240px;padding:4px 6px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);}
  .mc-veh.on{display:inline-block;}

  /* ---- Hero: sign + map ---------------------------------------------- */
  .mc-top{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:12px;margin-bottom:12px;}
  .mc-sign{position:relative;background:var(--sign);color:#fff;border:3px solid #fff;outline:1px solid #c9d2cc;border-radius:10px;padding:16px 16px 12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .mc-sign .spd{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.3);border-radius:6px;padding:4px 9px;line-height:1.1;}
  .mc-sign .spd b{display:block;font-size:19px;font-variant-numeric:tabular-nums;}
  .mc-sign .spd span{font-size:8.5px;letter-spacing:1px;color:rgba(255,255,255,.85);}
  .mc-sign .hdg{position:absolute;top:10px;right:10px;width:34px;height:34px;border:1.5px solid rgba(255,255,255,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
  .mc-sign .rt{font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
  .mc-sign .mi{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:76px;font-weight:700;line-height:1;letter-spacing:-3px;margin:6px 0 2px;font-variant-numeric:tabular-nums;}
  .mc-sign .lbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.85);}
  .mc-sign .none{font-size:16px;font-weight:700;padding:28px 0;}
  .mc-line{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.25);}
  .mc-line .bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 4px;}
  .mc-line .bar i{position:absolute;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.18);}
  .mc-line .ends{display:flex;justify-content:space-between;font-size:11.5px;margin-top:6px;font-variant-numeric:tabular-nums;}
  .mc-line .ends b{font-size:13px;}

  .mc-map{position:relative;min-height:200px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#e8e6df;}
  .mc-map .tile{position:absolute;width:256px;height:256px;}
  .mc-map .me{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#1a6fd6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,111,214,.25),0 1px 3px rgba(0,0,0,.4);}
  .mc-map .me::after{content:"";position:absolute;left:50%;top:-14px;margin-left:-5px;border:5px solid transparent;border-bottom:8px solid #1a6fd6;}
  .mc-map .brg{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:2px;background:var(--ok);border:2px solid #fff;}
  .mc-map .brg.up{background:var(--crit);}
  .mc-map .cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:rgba(255,255,255,.94);padding:5px 10px;font-size:11.5px;color:var(--ink);}
  .mc-map .cap b{font-weight:700;}
  .mc-map .attr{position:absolute;right:4px;top:3px;font-size:9.5px;color:#333;background:rgba(255,255,255,.8);padding:0 4px;border-radius:2px;}

  .mc-section-label{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:1.1px;font-weight:700;margin:0 0 6px 1px;}
  .mc-mid{display:grid;grid-template-columns:1fr 260px;gap:12px;margin-bottom:12px;}
  .mc-mid.nobr{grid-template-columns:1fr;}
  /* ---- Cameras: the actual road, nearest first ---------------------- */
  .mc-cams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .mc-cam{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .mc-cam .shot{width:100%;aspect-ratio:16/9;object-fit:cover;background:#dfe3e7;display:block;}
  .mc-cam .cap{padding:5px 8px 6px;}
  .mc-cam .nm{font-size:11.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mc-cam .mt{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;}
  /* ---- Drawbridges: only where live status actually exists ---------- */
  .mc-bridges{display:flex;flex-direction:column;gap:5px;}
  .mc-bridge{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:4px;padding:6px 10px;}
  .mc-bridge.up{border-left-color:var(--crit);background:#fbf0ee;}
  .mc-bridge .nm{flex:1;font-size:12.5px;font-weight:700;}
  .mc-bridge .st{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ok);}
  .mc-bridge.up .st{color:var(--crit);}
  .mc-bridge .dist{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:36px;text-align:right;}

  /* ---- Fleet Safety strip ------------------------------------------ */
  .mc-safety{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .mc-chip{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--info);border-radius:3px;padding:7px 12px;min-width:0;}
  .mc-chip .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--info);white-space:nowrap;}
  .mc-chip .v{font-size:12.5px;font-weight:600;}
  .mc-chip .sub{font-size:11px;color:var(--faint);}
  .mc-chip.caution,.mc-chip.strong{border-left-color:var(--warn);} .mc-chip.caution .k,.mc-chip.strong .k{color:var(--warn);}
  .mc-chip.strong{background:#fdf8ec;}
  .mc-chip.dangerous,.mc-chip.chains{border-left-color:var(--crit);background:#fbf0ee;} .mc-chip.dangerous .k,.mc-chip.chains .k{color:var(--crit);}
  .mc-chip.surface{border-left-color:var(--cool);} .mc-chip.surface .k{color:var(--cool);}

  /* ---- Alerts -------------------------------------------------------- */
  .mc-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .mc-col-h{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 6px 1px;}
  .mc-col-active .mc-col-h{color:var(--crit);}
  .mc-count{background:var(--line);color:var(--ink);font-size:10px;font-weight:700;border-radius:3px;padding:0 5px;line-height:16px;}
  .mc-col-empty{font-size:12px;color:var(--faint);padding:10px 12px;border:1px dashed #c4cad2;border-radius:3px;background:var(--surface);}
  .mc-alert{display:flex;gap:11px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--info);border-radius:3px;padding:8px 12px;margin-bottom:5px;}
  .mc-alert .body{flex:1;min-width:0;}
  .mc-alert .type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--info);}
  .mc-alert .type-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .mc-alert .dist{font-size:11px;font-weight:700;background:var(--line);border-radius:3px;padding:1px 7px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .mc-alert .desc{margin:2px 0 3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .mc-alert .meta{font-size:11.5px;color:var(--faint);display:flex;gap:9px;flex-wrap:wrap;}
  .mc-alert.closure{border-left-color:var(--crit);} .mc-alert.closure .type{color:var(--crit);}
  .mc-alert.construction{border-left-color:var(--warn);} .mc-alert.construction .type{color:var(--warn);}
  .mc-alert.weather{border-left-color:var(--cool);} .mc-alert.weather .type{color:var(--cool);}
  .mc-empty{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px;text-align:center;color:var(--muted);}
  .mc-foot{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .mc-foot a{color:var(--accent);text-decoration:none;font-weight:600;}
  .mc-skeleton{color:var(--muted);padding:20px;text-align:center;}
  .mc-err{display:none;margin:0 0 12px;padding:8px 12px;border:1px solid #e4c9c4;background:#fbf0ee;color:var(--crit);border-radius:3px;font-size:12px;font-weight:600;}
  .mc-err.on{display:block;}
  .mc-stale{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--warn);}

  @media (max-width:900px){ .mc-mid{grid-template-columns:1fr;} .mc-cams{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .mc-top{grid-template-columns:1fr;} .mc-cols{grid-template-columns:1fr;} .mc-map{min-height:170px;} .mc-sign .mi{font-size:64px;} #milecheck{padding:10px 12px;} .mc-vname{white-space:normal;} }
  .mc-sw{display:none;border:1px solid #c4cad2;border-radius:4px;overflow:hidden;background:var(--surface);}
  .mc-sw.on{display:inline-flex;}
  .mc-sw button{font:inherit;font-size:11px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:3px 9px;min-height:26px;cursor:pointer;white-space:nowrap;}
  .mc-sw button+button{border-left:1px solid #c4cad2;}
  .mc-sw button[aria-pressed="true"]{background:var(--accent);color:#fff;}
</style>
</head>
<body>
  <div id="milecheck">
    <div class="mc-header">
      <div class="mc-brand"><i aria-hidden="true"></i>MileCheck</div>
      <div class="mc-vehicle"><span class="mc-vname" id="mc-vname">&nbsp;</span>
        <span class="mc-live" id="mc-live"><span class="dot"></span>Live</span>
        <span class="mc-demo" id="mc-demo" title="Example vehicle shown with live road data. Pick one of your vehicles inside MyGeotab.">Sample vehicle</span>
        <span class="mc-sw" id="mc-sw" role="group" aria-label="Sample location"></span></div>
      <select class="mc-veh" id="mc-veh" aria-label="Choose vehicle"></select>
    </div>
    <div class="mc-err" id="mc-err" role="status"></div>
    <div id="mc-content"><div class="mc-skeleton">Locating vehicle&hellip;</div></div>
    <div class="mc-foot">
      <span id="mc-updated">&mdash;</span>
      <span>All 50 US states and 10 Canadian provinces and territories &middot; Support: <a href="mailto:info@milecheckapp.com">info@milecheckapp.com</a></span>
    </div>
  </div>

<script>
/* =================================================================
   MileCheck Add-In for MyGeotab / Geotab Drive
   -----------------------------------------------------------------
   Reads the vehicle position from the MyGeotab API, then calls the
   LIVE MileCheck Worker (existing /mileposts + /incidents endpoints)
   to render the nearest milepost + active state DOT feeds. No separate
   backend required — works against production today.
   ================================================================= */
(function(){
  "use strict";

  var MILECHECK_API = "https://api.milecheckapp.com";
  // Sample vehicle when not running inside Geotab: southbound I-5 in Seattle at NE 45th St,
  // where WSDOT cameras, live alerts and the five SDOT drawbridges all have real data.
  // Second sample: eastbound BC-1 (Trans-Canada) just west of Hope, between km posts
  // 170 and 171 on the BC corpus; DriveBC's Hope cameras are about 2.5 km away.
  // speed is mph like a live reading (56 mph shows as 90 km/h).
  var SAMPLES = {
    sea:{ label:"Seattle, WA", lat:47.6610, lon:-122.3225, bearing:180, speed:54 },
    bc:{ label:"Hope, BC", lat:49.3722, lon:-121.4460, bearing:45, speed:56 }
  };
  var SAMPLE_ORDER = ["sea","bc"];
  var DEMO_NAME = "Unit 214 \u00b7 Freightliner Cascadia";
  var ALERT_RADIUS_MI = 60, MAX_ALERTS = 12;

  /* ---- Add-on module config (2026-08-29) ---------------------------
     Fleet Safety, Cameras and Bridges are the modules the Marketplace
     listing describes. Each is driven by an endpoint already live in
     production; each renders ONLY when it has real data for this
     vehicle's position, so a calm dry day correctly shows nothing
     rather than an invented all-clear. */
  var CAM_RADIUS_MI = 40, MAX_CAMS = 4;     // nearest cameras worth showing
  var COND_RADIUS_MI = 60;                  // road-surface report relevance
  var BRIDGE_RADIUS_MI = 25;                // drawbridges near the vehicle

  // Crosswind thresholds — identical to the phone app (src/utils/wind.ts).
  // Deliberately NOT directive: a driver-awareness cue, not a legal restriction.
  var CROSSWIND_CAUTION = 20, CROSSWIND_STRONG = 30, CROSSWIND_DANGEROUS = 40;
  var COMPASS_TO_DEG = { N:0, NNE:22.5, NE:45, ENE:67.5, E:90, ESE:112.5, SE:135, SSE:157.5,
                         S:180, SSW:202.5, SW:225, WSW:247.5, W:270, WNW:292.5, NW:315, NNW:337.5 };

  // The FIVE Seattle drawbridges SDOT publishes live status for. University and
  // Lower Spokane St are deliberately absent — they are not in the live feed, and
  // claiming status we don't have is the exact overclaim this project guards against.
  var SEATTLE_BRIDGES = [
    { id:"WA-bridge-fremont",    name:"Fremont",    lat:47.6567, lon:-122.3501 },
    { id:"WA-bridge-ballard",    name:"Ballard",    lat:47.6584, lon:-122.3764 },
    { id:"WA-bridge-montlake",   name:"Montlake",   lat:47.6470, lon:-122.3048 },
    { id:"WA-bridge-south-park", name:"South Park", lat:47.5285, lon:-122.3133 },
    { id:"WA-bridge-1st-ave-s",  name:"1st Ave S",  lat:47.5405, lon:-122.3539 }
  ];

  // Bounding boxes — all 50 states (mirrors constants/states.ts). Order matters:
  // first match wins; ID before MT (MT's box extends into the Idaho panhandle).
  var STATE_BOUNDS = {
    WA:{minLat:45.54,maxLat:49.00,minLon:-124.85,maxLon:-116.91}, OR:{minLat:41.99,maxLat:46.29,minLon:-124.57,maxLon:-116.46},
    ID:{minLat:42.00,maxLat:49.00,minLon:-117.24,maxLon:-111.04}, MT:{minLat:44.36,maxLat:49.00,minLon:-116.05,maxLon:-104.04},
    AZ:{minLat:31.33,maxLat:36.999,minLon:-114.82,maxLon:-109.04}, UT:{minLat:37.00,maxLat:42.00,minLon:-114.05,maxLon:-109.04},
    CO:{minLat:37.001,maxLat:41.00,minLon:-109.05,maxLon:-102.04}, NM:{minLat:31.33,maxLat:37.00,minLon:-109.05,maxLon:-103.00},
    AK:{minLat:54.50,maxLat:71.50,minLon:-165.00,maxLon:-129.50}, SD:{minLat:42.48,maxLat:45.94,minLon:-104.06,maxLon:-96.43},
    ND:{minLat:45.94,maxLat:49.00,minLon:-104.05,maxLon:-96.55}, NE:{minLat:40.00,maxLat:43.00,minLon:-104.05,maxLon:-95.31},
    KS:{minLat:37.00,maxLat:40.00,minLon:-102.05,maxLon:-94.59}, WI:{minLat:42.49,maxLat:47.08,minLon:-92.89,maxLon:-86.80},
    MN:{minLat:43.50,maxLat:49.00,minLon:-97.21,maxLon:-89.60}, IA:{minLat:40.37,maxLat:43.50,minLon:-96.64,maxLon:-90.14},
    IL:{minLat:36.97,maxLat:42.51,minLon:-91.52,maxLon:-87.02}, WY:{minLat:40.99,maxLat:45.01,minLon:-111.06,maxLon:-104.05},
    ME:{minLat:43.06,maxLat:47.46,minLon:-71.08,maxLon:-66.95}, RI:{minLat:41.15,maxLat:42.02,minLon:-71.86,maxLon:-71.12},
    MI:{minLat:41.70,maxLat:48.30,minLon:-90.42,maxLon:-82.12}, NV:{minLat:35.00,maxLat:42.00,minLon:-120.01,maxLon:-114.04},
    NJ:{minLat:38.92,maxLat:41.36,minLon:-75.56,maxLon:-73.89}, DE:{minLat:38.45,maxLat:39.84,minLon:-75.79,maxLon:-75.04},
    MD:{minLat:37.91,maxLat:39.73,minLon:-79.49,maxLon:-75.04}, VA:{minLat:36.54,maxLat:39.47,minLon:-83.68,maxLon:-75.24},
    WV:{minLat:37.20,maxLat:40.64,minLon:-82.65,maxLon:-77.72}, OH:{minLat:38.40,maxLat:42.00,minLon:-84.82,maxLon:-80.52},
    PA:{minLat:39.72,maxLat:42.27,minLon:-80.52,maxLon:-74.69}, MA:{minLat:41.18,maxLat:42.89,minLon:-73.51,maxLon:-69.93},
    VT:{minLat:42.73,maxLat:45.02,minLon:-73.43,maxLon:-71.46}, NH:{minLat:42.70,maxLat:45.31,minLon:-72.56,maxLon:-70.70},
    CT:{minLat:40.98,maxLat:42.05,minLon:-73.73,maxLon:-71.79}, NY:{minLat:40.48,maxLat:45.02,minLon:-79.77,maxLon:-71.86},
    FL:{minLat:24.40,maxLat:31.00,minLon:-87.63,maxLon:-80.03}, GA:{minLat:30.36,maxLat:35.00,minLon:-85.61,maxLon:-80.84},
    NC:{minLat:33.84,maxLat:36.59,minLon:-84.32,maxLon:-75.46}, SC:{minLat:32.03,maxLat:35.22,minLon:-83.35,maxLon:-78.54},
    MS:{minLat:30.17,maxLat:35.00,minLon:-91.66,maxLon:-88.10}, AL:{minLat:30.22,maxLat:35.01,minLon:-88.47,maxLon:-84.89},
    AR:{minLat:33.00,maxLat:36.50,minLon:-94.62,maxLon:-89.64}, LA:{minLat:28.93,maxLat:33.02,minLon:-94.04,maxLon:-88.82},
    OK:{minLat:33.62,maxLat:37.00,minLon:-103.00,maxLon:-94.43}, TN:{minLat:34.98,maxLat:36.68,minLon:-90.31,maxLon:-81.65},
    KY:{minLat:36.50,maxLat:39.15,minLon:-89.57,maxLon:-81.96}, IN:{minLat:37.77,maxLat:41.76,minLon:-88.10,maxLon:-84.78},
    MO:{minLat:36.00,maxLat:40.61,minLon:-95.77,maxLon:-89.10}, CA:{minLat:32.5,maxLat:42.0,minLon:-124.5,maxLon:-114.1},
    HI:{minLat:18.5,maxLat:22.5,minLon:-160.5,maxLon:-154.5}, TX:{minLat:25.8,maxLat:36.5,minLon:-106.7,maxLon:-93.5},
    // Canadian provinces and territories, LAST so every US state wins at the border
    // (same order as constants/states.ts). Their posts are kilometre markers.
    ON:{minLat:41.66,maxLat:56.90,minLon:-95.16,maxLon:-74.32}, QC:{minLat:44.99,maxLat:62.60,minLon:-79.77,maxLon:-57.10},
    BC:{minLat:48.30,maxLat:60.02,minLon:-139.06,maxLon:-114.03}, AB:{minLat:48.99,maxLat:60.00,minLon:-120.01,maxLon:-109.95},
    NS:{minLat:43.35,maxLat:47.10,minLon:-66.50,maxLon:-59.60}, NT:{minLat:59.98,maxLat:70.20,minLon:-137.00,maxLon:-110.00},
    MB:{minLat:48.99,maxLat:60.00,minLon:-102.11,maxLon:-88.90}, SK:{minLat:48.99,maxLat:60.00,minLon:-110.10,maxLon:-101.30},
    NB:{minLat:44.55,maxLat:48.10,minLon:-69.10,maxLon:-63.70}, YT:{minLat:59.90,maxLat:69.70,minLon:-141.01,maxLon:-123.80}
  };
  // name + DOT label per state; alerts:1 = live DOT feed (50 states), 0 = mileposts only (WY, RI).
  var STATE_META = {

  var KM_PER_MI = 1.609344;

  function detectState(lat,lon){ for(var s in STATE_BOUNDS){ var b=STATE_BOUNDS[s];

  function haversine(a,b,c,d){ var R=3958.8,p=Math.PI/180,dLat=(c-a)*p,dLon=(d-b)*p;
    var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
  function bearingToDir(b){ if(b==null) return ""; b=((b%360)+360)%360;

  var WA_INTERSTATES={"5":1,"82":1,"90":1,"182":1,"205":1,"405":1,"705":1};
  function normalizeRoad(h){ if(!h) return ""; var m=h.match(/^SR[\s-]?(\d+)$/i);

  // Map MileCheck classification → the 4 native UI buckets + a human label.
  function classify(text, eventType){
    var s=(text||"").toLowerCase();

    if((/\bclosed\b|closure|road closed/.test(s))&&!/lane|ramp|rest area/.test(s)) return {cls:"closure",label:"Closure",sev:"high"};
    if(/snow|ice|icy|chain|blizzard|freezing|black ice/.test(s)) return {cls:"weather",label:"Winter",sev:"med"};
    if(/construction|roadwork|work zone|lane clos|paving/.test(s)||eventType==="RW") return {cls:"construction",label:"Construction",sev:"med"};
    if(/flood|wind|fog|storm|weather|rock|slide|debris/.test(s)||eventType==="WE"||eventType==="HZ") return {cls:"weather",label:"Weather",sev:"med"};
    return {cls:"info",label:"Advisory",sev:"low"};

  function minsAgo(ts){ if(!ts) return null; var ms=(""+ts).length>=13?+ts:+ts*1000;
    if(!isFinite(ms)) { var d=Date.parse(ts); if(isNaN(d)) return null; ms=d; }

  /* ---- Crosswind (Fleet Safety module) -----------------------------
     Mirrors src/utils/wind.ts in the phone app, deliberately identical so
     the fleet console and the driver's phone can never disagree:
        crosswind = | wind_speed x sin(wind_direction - heading) |
     wind_direction is where the wind comes FROM (NWS convention); heading
     is where the vehicle is GOING. A 40 mph tailwind is fuel; a 40 mph
     crosswind pushes a trailer — the sine isolates that component. */
  function crosswindMph(windMph, dirCompass, headingDeg){
    if(windMph==null||windMph<=0||headingDeg==null) return null;
    var wd=COMPASS_TO_DEG[(dirCompass||"").toUpperCase()];
    if(wd==null) return null;
    var off=wd-headingDeg;
    while(off>180) off-=360; while(off<-180) off+=360;
    return Math.abs(windMph*Math.sin(off*Math.PI/180));
  }
  function crosswindTier(mph){
    if(mph==null) return null;
    if(mph>=CROSSWIND_DANGEROUS) return {cls:"dangerous", label:"Dangerous crosswind"};
    if(mph>=CROSSWIND_STRONG)    return {cls:"strong",    label:"Strong crosswind"};
    if(mph>=CROSSWIND_CAUTION)   return {cls:"caution",   label:"Crosswind"};
    return null; // below 20 mph is not worth a driver's attention
  }
  // NWS returns windSpeed as a range string ("10 to 15 mph"); take the upper
  // bound, matching the phone app's parse.
  function parseWindMph(s){
    if(s==null) return null;
    var nums=String(s).match(/\d+/g);
    if(!nums||!nums.length) return null;
    return Math.max.apply(null, nums.map(Number));
  }

  // Triage an alert into the two columns the dispatcher cares about.
  var STALE_MIN = 48*60;  // alerts not updated in 48 h are labelled stale, never "Active"
  function bucket(a){
    if(a.updated!=null && a.updated>STALE_MIN) return "planned";
    var s=(a.desc||"").toLowerCase();
    var planned=/nightly|overnight|night work|nighttime|each night|seasonal|long-term|until further notice|reopening|scheduled|begins? \w+ \d|through \w+ \d|\d\s*(p\.?m\.?)\s*(-|to)\s*\d/.test(s);
    if(a.label==="Crash") return "active";
    if(/\bdelay|backed up|congest|stop-and-go|stopped traffic/.test(s)) return "active";
    if(a.label==="Closure" && !planned) return "active"; // closed right now
    return "planned"; // nightly / long-term closures, construction, weather
  }

  /* ---- Hero helpers --------------------------------------------- */
  var HDG=["N","NE","E","SE","S","SW","W","NW"];
  function compass(b){ if(b==null) return ""; return HDG[Math.round((((b%360)+360)%360)/45)%8]; }
  function fmtD(d, km){
    if(km){ var k=d*KM_PER_MI; return k<0.1 ? Math.round(k*1000/10)*10+" m" : k.toFixed(1)+" km"; }
    return d<0.1 ? Math.round(d*5280/10)*10+" ft" : d.toFixed(1)+" mi"; }
  // Whole-number distance label: "<1 mi" / "12 km".
  function fmtDist(d, km){ var v=km?d*KM_PER_MI:d, u=km?" km":" mi"; return (v<1?"<1":Math.round(v))+u; }
  function signHtml(d){
    var dir=d.direction?(" "+d.direction):"";
    // d.speed is mph throughout; kilometre regions show km/h.
    var km=!!d.km, P=km?"KM":"MP", spdV=d.speed!=null?Math.round(km?d.speed*KM_PER_MI:d.speed):null;
    var spd=spdV!=null?'<div class="spd"><b>'+spdV+'</b><span>'+(km?'KM/H':'MPH')+'</span></div>':'';
    var hdg=d.bearing!=null?'<div class="hdg" aria-label="Heading '+compass(d.bearing)+'">'+compass(d.bearing)+'</div>':'';
    if(d.milepost==null){
      return '<div class="mc-sign" role="img" aria-label="No mile marker found near this vehicle">'+spd+hdg
        +'<div class="none">No '+(km?'kilometre':'mile')+' marker within range</div><div class="lbl">'+esc(d.state||"")+'</div></div>';
    }
    var line='';
    if(d.seg){
      // Lower mile marker always on the left, like the phone app's slider.
      var g=d.seg, L=g.lo, R=g.hi, Ld=g.loD, Rd=g.hiD;
      var pct=Math.max(4,Math.min(96,(Ld/(Ld+Rd||1))*100));
      line='<div class="mc-line"><div class="bar"><i style="left:'+pct.toFixed(1)+'%"></i></div>'
        +'<div class="ends"><span><b>'+P+' '+L+'</b> &middot; '+fmtD(Ld,km)+'</span><span>'+fmtD(Rd,km)+' &middot; <b>'+P+' '+R+'</b></span></div></div>';
    }
    return '<div class="mc-sign" role="img" aria-label="'+esc((d.route||"")+dir+(km?", kilometre ":", mile ")+d.milepost.toFixed(1)+(spdV!=null?", "+spdV+(km?" km/h":" mph"):""))+'">'+spd+hdg
      +'<div class="rt">'+esc(d.route||"")+esc(dir)+'</div>'
      +'<div class="mi">'+d.milepost.toFixed(1)+'</div>'
      +'<div class="lbl">'+(km?'Kilometre marker':'Mile marker')+' &middot; '+esc(d.state||"")+'</div>'+line+'</div>';
  }
  // Small position map from Esri street tiles (no key). 3x3 tiles centred on the vehicle.
  function mapHtml(d){
    if(d.lat==null) return '';
    var z=13, n=Math.pow(2,z), r=d.lat*Math.PI/180;
    var px=(d.lon+180)/360*n*256, py=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n*256;
    var tx=Math.floor(px/256), ty=Math.floor(py/256), t='';
    for(var i=-2;i<=2;i++) for(var k=-1;k<=1;k++){
      var x=tx+i, y=ty+k;
      t+='<img class="tile" alt="" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/'+z+'/'+y+'/'+x+'" '
        +'style="left:calc(50% + '+Math.round(x*256-px)+'px);top:calc(50% + '+Math.round(y*256-py)+'px)">';
    }
    (d.bridges||[]).forEach(function(b){
      var br=b.lat*Math.PI/180, bx=(b.lon+180)/360*n*256-px, by=(1-Math.log(Math.tan(br)+1/Math.cos(br))/Math.PI)/2*n*256-py;
      if(Math.abs(bx)<600&&Math.abs(by)<120) t+='<span class="brg'+(b.up?' up':'')+'" title="'+esc(b.name)+' Bridge" style="left:calc(50% + '+Math.round(bx)+'px);top:calc(50% + '+Math.round(by)+'px)"></span>';
    });
    var rot=d.bearing!=null?' style="transform:rotate('+Math.round(d.bearing)+'deg)"':'';
    return '<div class="mc-map" role="img" aria-label="Map of the vehicle position, '+esc(d.lat.toFixed(4)+", "+d.lon.toFixed(4))+'">'+t
      +'<span class="me"'+rot+'></span><span class="attr">Esri</span>'
      +'<div class="cap"><span><b>'+esc(d.route||"Off highway")+(d.direction?" "+esc(d.direction):"")+'</b>'
      +(d.milepost!=null?' near '+(d.km?'KM ':'MP ')+d.milepost.toFixed(1):'')+', '+esc(d.state||"")+'</span>'
      +'<span>'+d.lat.toFixed(4)+', '+d.lon.toFixed(4)+'</span></div></div>';
  }

  var lastUpdated = null;

  function render(data, isLive){

        +'<div class="type-row"><span class="type">'+esc(a.label)+'</span>'

        +(a.desc?'<div class="desc">'+esc(a.desc)+'</div>':'')
        +'<div class="meta"><span>'+esc(a.route||"")+mpTxt+'</span>'
        +'<span>'+(a.source?esc(a.source):'')+(a.updated!=null?(a.source?' &middot; ':'')+rel(a.updated):'')+'</span>'

        +' <span class="mc-count">'+arr.length+'</span></div>'

    /* ---- Fleet Safety strip ----------------------------------------

       than a second call — the DOT feed is where chain restrictions
       live. Renders only what's real; nothing on a calm, dry day. */
    var chainAlert=null;
    for(var ci=0; ci<alerts.length; ci++){
      if(/chain|traction tire|snow tire/i.test(alerts[ci].desc||"")){ chainAlert=alerts[ci]; break; }
    }
    var chips=[];
    if(data.crosswind){
      chips.push('<div class="mc-chip '+data.crosswind.tier.cls+'">'
        +'<span class="k">'+esc(data.crosswind.tier.label)+'</span>'
        +'<span class="v">'+data.crosswind.mph+' mph</span>'
        +'<span class="sub">wind '+esc(data.crosswind.wind||"")+' from '+esc(data.crosswind.from||"")+'</span></div>');

      chips.push('<div class="mc-chip chains"><span class="k">Chain control</span>'
        +'<span class="v">'+esc((chainAlert.route||"In effect")).slice(0,22)+'</span>'
        +(chainAlert.dist!=null?'<span class="sub">'+fmtDist(chainAlert.dist, data.km)+'</span>':'')
        +'</div>');

    if(data.surface){
      chips.push('<div class="mc-chip surface"><span class="k">Road surface</span>'
        +'<span class="v">'+esc(data.surface.text)+'</span>'

      ? '<div class="mc-section-label">Fleet safety</div><div class="mc-safety">'+chips.join("")+'</div>'

    var camBlock='';

        +data.cameras.map(function(c){
          var meta=(c.route?esc(c.route):"")+((c._m!=null||c.mile!=null)?" &middot; "+(data.km?"KM ":"MP ")+esc(String(c._m!=null?c._m:c.mile)):"");
          return '<div class="mc-cam">'
            +'<img class="shot" loading="lazy" alt="'+esc("Traffic camera: "+(c.title||"near vehicle"))+'" src="'+esc(c.imageUrl)+'" '
            +'onerror="this.style.visibility=\'hidden\'">'

      + '<div class="mc-section-label">'+(data.km?'Provincial road alerts within '+Math.round(ALERT_RADIUS_MI*KM_PER_MI)+' km':'State DOT alerts within '+ALERT_RADIUS_MI+' mi')+'</div>' + alertsBlock;

  // Parsed milepost file per state, kept for the session. The file is 1-2 MB;
  // only position and alerts are refetched on each refresh.
  var MP_CACHE = {};
  function okJson(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
  function getMileposts(state){
    if(MP_CACHE[state]) return Promise.resolve(MP_CACHE[state]);
    return fetch(MILECHECK_API+"/mileposts?state="+state).then(okJson);
  }

  function loadFor(lat, lon, bearing, isLive, speed){
    var state=detectState(lat,lon), meta=state?STATE_META[state]:null;
    if(!state){ render({state:"this area",milepost:null,alerts:[],alertsAvail:false}, isLive); return; }
    var out={state:meta.name,km:!!meta.km,route:"",direction:bearingToDir(bearing),speed:(speed!=null?speed:null),milepost:null,lat:lat,lon:lon,bearing:bearing,
             alertsAvail:!!meta.alerts,alerts:[]};
    var jobs=[
      getMileposts(state).then(function(mps){
        // Some states (e.g. AZ) return mileposts grouped by route:
        //   { "I-40":[{mile,lat,lng},...], "US-89":[...] }  — route is the KEY, coords use `lng`.
        // Flatten to a flat array, attaching the route key to each point and dropping
        // junk routes with <=2 points (mirrors the phone app's useAllMileposts filter).
        if(!Array.isArray(mps)){
          if(mps&&typeof mps==="object"){ var flat=[];
            for(var rk in mps){ var arr=mps[rk]; if(!Array.isArray(arr)||arr.length<=2) continue;
              for(var qi=0;qi<arr.length;qi++){ var e=arr[qi]; if(!e) continue;
                if(e.route==null&&e.highway==null) e.route=rk; flat.push(e); } }
            mps=flat;
          } else { return; }
        }
        MP_CACHE[state]=mps;
        if(!mps.length) return;
        var best=null,bd=Infinity,major=null,md=Infinity;
        for(var i=0;i<mps.length;i++){ var m=mps[i];
          var la=m.lat!=null?m.lat:m.latitude, lo=m.lon!=null?m.lon:(m.lng!=null?m.lng:m.longitude);
          if(la==null||lo==null) continue;
          m._d=haversine(lat,lon,la,lo);
          if(m._d<bd){ bd=m._d; best=m; }
          if(/^I-/.test(normalizeRoad(m.highway||m.route||""))&&m._d<md){ md=m._d; major=m; } }
        var pick=(major&&md<=bd+2.0)?major:best;
        if(!pick) return;
        out.route=normalizeRoad(pick.highway||pick.route||"");
        var mileOf=function(m){ return m.milepost!=null?m.milepost:m.mile; };
        // Interpolate a 1-decimal position from the two nearest markers on this
        // route with different whole-mile values (mirrors the phone app).
        var same=mps.filter(function(m){ return m._d!=null && normalizeRoad(m.highway||m.route||"")===out.route && mileOf(m)!=null; })
                    .sort(function(x,y){ return x._d-y._d; });
        var a=same[0], b=null;
        if(a){ var ra=Math.round(mileOf(a));
          for(var k=1;k<same.length;k++){ if(Math.round(mileOf(same[k]))!==ra){ b=same[k]; break; } } }
        if(a&&b&&Math.abs(Math.round(mileOf(a))-Math.round(mileOf(b)))<=3){
          var ma=Math.round(mileOf(a)), mb=Math.round(mileOf(b));
          var lom=Math.min(ma,mb), him=Math.max(ma,mb);
          var lod=(ma<mb)?a._d:b._d, tot=a._d+b._d, frac=tot>0?lod/tot:0;
          out.milepost=Math.round((lom+frac*(him-lom))*10)/10;
          out.seg={lo:lom,hi:him,loD:lod,hiD:tot-lod};
        } else if(a){ out.milepost=Math.round(mileOf(a)*10)/10; }
      }).catch(function(){ delete MP_CACHE[state]; out.fetchErr=true; })
    ];
    if(out.alertsAvail){
      jobs.push(fetch(MILECHECK_API+"/incidents?state="+state).then(okJson).then(function(j){
        var list=(j&&j["incident-reports"])||[];
        list.forEach(function(inc){
          var loc=inc.location||{}, sl=loc["start-location"]||{};
          var la=sl["start-lat"], lo=sl["start-long"];
          var dist=(la!=null&&lo!=null)?haversine(lat,lon,la,lo):null;
          if(dist!=null&&dist>ALERT_RADIUS_MI) return;
          var txt=(inc.headline||"")+" "+(inc["impact-desc"]||"")+" "+(inc.description||"");
          var c=classify(txt, inc["event-type-id"]);
          out.alerts.push({ cls:c.cls, label:c.label, sev:c.sev,
            route:normalizeRoad(loc["route-id"]||loc["location-name"]||""),
            mp:sl["start-mile-marker"],
            desc:((inc["impact-desc"]||inc.description||inc.headline||"").replace(/<[^>]+>/g," ").trim()).slice(0,160),
            source:meta.dot, updated:minsAgo(inc["last-updated"]||inc["update-time"]), dist:dist });
        });
      }).catch(function(){ out.fetchErr=true; }));
    }
    /* ---- MODULE: Fleet Safety — crosswind ---------------------------
       NWS is called directly from the browser (it sends
       access-control-allow-origin:*, verified). Two hops: /points to get
       the forecast grid, then the forecast itself. Any failure is silent —
       a missing crosswind reading must never block the milepost. */
    // NWS covers the US only; skip the call in Canada instead of logging a 404.
    if(bearing!=null && !out.km){
      jobs.push(
        fetch("https://api.weather.gov/points/"+lat.toFixed(4)+","+lon.toFixed(4))
          .then(function(r){ return r.ok?r.json():null; })
          .then(function(p){
            var url=p&&p.properties&&p.properties.forecast;
            return url?fetch(url).then(function(r){ return r.ok?r.json():null; }):null;
          })
          .then(function(f){
            var per=f&&f.properties&&f.properties.periods&&f.properties.periods[0];
            if(!per) return;
            var mph=parseWindMph(per.windSpeed);
            var xw=crosswindMph(mph, per.windDirection, bearing);
            var tier=crosswindTier(xw);
            if(tier) out.crosswind={ mph:Math.round(xw), tier:tier, wind:per.windSpeed, from:per.windDirection };
          }).catch(function(){})
      );
    }

    /* ---- MODULE: Fleet Safety — road surface / winter conditions ---- */
    if(out.alertsAvail){
      jobs.push(fetch(MILECHECK_API+"/conditions?state="+state)
        .then(function(r){ return r.json(); })
        .then(function(j){
          var list=(j&&j["road-weather-reports"])||[], best=null, bd=Infinity;
          list.forEach(function(c){
            var la=c.latitude!=null?c.latitude:(c.location&&c.location["start-location"]||{})["start-lat"];
            var lo=c.longitude!=null?c.longitude:(c.location&&c.location["start-location"]||{})["start-long"];
            if(la==null||lo==null) return;
            var d=haversine(lat,lon,la,lo);
            if(d<=COND_RADIUS_MI && d<bd){ bd=d; best=c; }
          });
          // Only surface a report that actually says something. Off-season
          // placeholders ("Reports have ended for this season") are noise in
          // a fleet console and get dropped.
          if(!best) return;
          var txt=(best["road-surface-condition"]||"").trim();
          if(!txt || /reports have ended|no report|not reported/i.test(txt)) return;
          out.surface={ text:txt.slice(0,90), where:(best["location-name"]||"").slice(0,40), dist:bd };
        }).catch(function(){}));
    }

    /* ---- MODULE: Cameras — see the actual road ---------------------- */
    jobs.push(fetch(MILECHECK_API+"/cameras?state="+state)
      .then(function(r){ return r.json(); })
      .then(function(j){
        var cams=(j&&j.cameras)||[];
        var near=cams.filter(function(c){
          return c && c.isActive!==false && c.imageUrl && c.lat!=null && c.lon!=null;
        }).map(function(c){
          c._d=haversine(lat,lon,c.lat,c.lon); return c;
        }).filter(function(c){ return c._d<=CAM_RADIUS_MI; })
          .sort(function(a,b){ return a._d-b._d; });
        // Prefer cameras on the vehicle's own highway, one per mile, so the strip
        // shows the road ahead and behind instead of four views of one interchange.
        var rt=(out.route||"").replace(/[^A-Z0-9]/gi,"").toUpperCase(), pick=[];
        var camMile=function(c){ var m=/\bMP\s*(\d+(?:\.\d+)?)/i.exec(c.title||""); return m?parseFloat(m[1]):(c.mile!=null?+c.mile:null); };
        near.forEach(function(c){ var cr=(c.route||"").replace(/[^A-Z0-9]/gi,"").toUpperCase(), cm=camMile(c);
          if(!rt||cr!==rt||pick.length>=MAX_CAMS||cm==null) return;
          if(pick.every(function(p){ return Math.abs(p._m-cm)>=0.7; })){ c._m=cm; pick.push(c); } });
        near.forEach(function(c){ if(pick.length<MAX_CAMS&&pick.indexOf(c)<0) pick.push(c); });
        near=pick;
        if(near.length) out.cameras=near;
      }).catch(function(){}));

    /* ---- MODULE: Drawbridges — live raised/lowered ------------------
       Only the five bridges SDOT actually publishes, and only when the
       vehicle is near them. Elsewhere the module renders nothing. */
    var nearBridges=SEATTLE_BRIDGES.map(function(b){
      return { b:b, d:haversine(lat,lon,b.lat,b.lon) };
    }).filter(function(x){ return x.d<=BRIDGE_RADIUS_MI; })
      .sort(function(x,y){ return x.d-y.d; });
    if(nearBridges.length){
      jobs.push(fetch(MILECHECK_API+"/bridge-status")
        .then(function(r){ return r.json(); })
        .then(function(j){
          var raised=(j&&j.raised)||[];
          out.bridges=nearBridges.map(function(x){
            return { name:x.b.name, dist:x.d, lat:x.b.lat, lon:x.b.lon, up:raised.indexOf(x.b.id)>=0 };
          });
        }).catch(function(){}));
    }

    Promise.all(jobs).then(function(){
      out.alerts.sort(function(a,b){ var sev={high:0,med:1,low:2};
        if(sev[a.sev]!==sev[b.sev]) return sev[a.sev]-sev[b.sev];
        return (a.dist==null?1e9:a.dist)-(b.dist==null?1e9:b.dist); });
      out.alerts=out.alerts.slice(0,MAX_ALERTS);
      render(out, isLive);
    });
  }

  /* ---- Sample switch (standalone/demo only) ---------------------- */
  var sampleKey = SAMPLE_ORDER[0];
  function setupSwitch(){
    var sw=el("mc-sw"); if(!sw||sw.childNodes.length) return;
    sw.innerHTML=SAMPLE_ORDER.map(function(k){ return '<button type="button" data-k="'+k+'" aria-pressed="'+(k===sampleKey)+'">'+esc(SAMPLES[k].label)+'</button>'; }).join("");
    sw.onclick=function(e){ var b=e.target.closest&&e.target.closest("button"); if(!b||b.getAttribute("data-k")===sampleKey) return;
      sampleKey=b.getAttribute("data-k");
      [].forEach.call(sw.querySelectorAll("button"),function(x){ x.setAttribute("aria-pressed", String(x.getAttribute("data-k")===sampleKey)); });
      el("mc-content").innerHTML='<div class="mc-skeleton">Locating vehicle&hellip;</div>';
      load(currentApi, pickerState); };
  }

  var backoffUntil = 0;

  // Pull the vehicle's last-known position from MyGeotab (null in a demo DB w/ no device).
  function getVehiclePosition(api, state){
    return new Promise(function(resolve){
      if(!api){ return resolve(null); }
      // Always ask for ONE vehicle. An empty search returns every device in the database,
      // which is what Geotab's Nov 15 2026 API limits are aimed at. No vehicle selected = no call.
      // Geotab Drive passes state.device; MyGeotab has no device, so use the picker.
      var deviceId = (state&&state.device&&state.device.id) || selectedDeviceId;
      if(!deviceId){ return resolve(null); }
      if(Date.now() < backoffUntil){ return resolve(null); }
      try{
        api.call("Get", {typeName:"DeviceStatusInfo", search:{ deviceSearch:{ id:deviceId } }}, function(result){
          var pick=null;
          (result||[]).forEach(function(r){ if(r&&r.latitude!=null&&r.longitude!=null&&(r.latitude||r.longitude)){
            if(!pick||(r.dateTime||"")>(pick.dateTime||"")) pick=r; } });
          resolve(pick?{lat:pick.latitude,lon:pick.longitude,bearing:pick.bearing,speed:pick.speed!=null?Math.round(pick.speed*0.621371):null}:null);
        }, function(err){
          // OverLimitException: stop calling for 2 minutes instead of retrying into the limit.
          if(/OverLimit/i.test(String((err&&(err.name||err.message))||err))){ backoffUntil = Date.now()+120000; }
          resolve(null);
        });
      }catch(e){ resolve(null); }
    });
  }

  /* ---- Vehicle picker (MyGeotab) ---------------------------------
     One Get Device call per session, scoped to the user's group filter and
     capped by resultsLimit. Position is then read for the chosen id only. */
  var DEVICE_LIMIT = 500, PICK_KEY = "milecheckDevice";
  var devicesLoaded = false, selectedDeviceId = null, pickerState = null;
  function readSavedChoice(state){
    try{ var g=state&&state.getState&&state.getState(); if(g&&g[PICK_KEY]) return g[PICK_KEY]; }catch(e){}
    try{ return window.localStorage.getItem("mc."+PICK_KEY); }catch(e){}
    return null;
  }
  function saveChoice(state, id){
    try{ if(state&&state.setState){ var o={}; o[PICK_KEY]=id; state.setState(o); } }catch(e){}
    try{ window.localStorage.setItem("mc."+PICK_KEY, id); }catch(e){}
  }
  function initPicker(api, state, done){
    if(!api || (state&&state.device&&state.device.id) || devicesLoaded){ return done(); }
    devicesLoaded = true;
    var search = { fromDate: new Date().toISOString() };  // active devices only
    try{ var gf = state&&state.getGroupFilter&&state.getGroupFilter(); if(gf&&gf.length) search.groups = gf; }catch(e){}
    try{
      api.call("Get", {typeName:"Device", resultsLimit:DEVICE_LIMIT, search:search}, function(list){
        list = (list||[]).filter(function(d){ return d&&d.id; })
          .sort(function(a,b){ return String(a.name||"").localeCompare(String(b.name||"")); });
        var sel = el("mc-veh"), saved = readSavedChoice(state);
        if(!list.length){ return done(); }
        sel.innerHTML = list.map(function(d){
          return '<option value="'+esc(d.id)+'">'+esc(d.name||d.id)+'</option>'; }).join("");
        var has = list.some(function(d){ return d.id===saved; });
        selectedDeviceId = has ? saved : list[0].id;
        sel.value = selectedDeviceId;
        sel.classList.add("on");
        sel.onchange = function(){ selectedDeviceId = sel.value; saveChoice(pickerState, selectedDeviceId); load(currentApi, pickerState); };
        done();
      }, function(){ devicesLoaded = false; done(); });
    }catch(e){ devicesLoaded = false; done(); }
  }

  var currentApi = null;
  function load(api, state){
    currentApi = api; pickerState = state;
    // Geotab asks add-ins to handle a dropped connection. Keep the last render
    // instead of showing empty alert columns that read as "all clear".
    if(state && state.online === false){
      el("mc-updated").textContent = lastUpdated ? "Offline, last updated "+hhmm(lastUpdated) : "Offline";
      showErr(lastUpdated ? "Offline, last updated "+hhmm(lastUpdated)+". Data below may be out of date." : "Offline. MileCheck data will load when the connection returns.");
      return;
    }
    if(api && !devicesLoaded && !(state&&state.device&&state.device.id)){
      return initPicker(api, state, function(){ load2(api, state); });
    }
    load2(api, state);
  }
  function load2(api, state){
    getVehiclePosition(api, state).then(function(pos){
      var sel=el("mc-veh"), nm=(sel&&sel.selectedIndex>=0&&sel.options[sel.selectedIndex])?sel.options[sel.selectedIndex].text:"";
      el("mc-vname").textContent = pos ? (nm || (state&&state.device&&state.device.name) || "Selected vehicle") : DEMO_NAME;
      if(pos){ loadFor(pos.lat, pos.lon, pos.bearing, true, pos.speed); }
      else { setupSwitch(); var sp=SAMPLES[sampleKey]; loadFor(sp.lat, sp.lon, sp.bearing, false, sp.speed); }
    });
  }

  /* ---- Geotab Add-In lifecycle ---------------------------------- */
  var REFRESH_MS = 60000;  // re-pull position + state DOT feeds every 60s while the panel is open
  var STANDALONE = (typeof geotab==="undefined");
  if(STANDALONE){ window.geotab={}; }
  geotab.addin = geotab.addin || {};
  geotab.addin.milecheck = function(){
    var api, st, timer;
    return {
      initialize:function(freshApi, state, callback){ api=freshApi; st=state; if(callback) callback(); },
      focus:function(freshApi, state){ api=freshApi||api; st=state||st; load(api, st);
        if(timer) clearInterval(timer); timer=setInterval(function(){ load(api, st); }, REFRESH_MS); },
      blur:function(){ if(timer){ clearInterval(timer); timer=null; } }
    };
  };

  // Standalone preview: opened directly in a browser (not embedded in MyGeotab),
  // the host never calls focus(), so render demo mode (DEMO_POS) ourselves and
  // refresh on the same cadence. Skipped inside MyGeotab (geotab is defined there).
  if(STANDALONE){
    var run=function(){ load(null, null); };
    if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", run); }
    else { run(); }
    setInterval(run, REFRESH_MS);
  }
})();
</script>
