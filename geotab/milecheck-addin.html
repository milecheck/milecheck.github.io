<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MileCheck</title>
<style>
  /* ----------------------------------------------------------------
     Fleet-ops console styling — muted, dense, squared-off. Designed
     to read as a native MyGeotab / Geotab Drive data widget, not a
     consumer app card. One deep-navy accent; severity shown by a thin
     muted tick, not a rainbow.
  ----------------------------------------------------------------- */
  :root{
    --ink:#161a1f; --muted:#6e7782; --faint:#99a2ac; --line:#dce0e6;
    --surface:#fff; --bg:#eceef1; --accent:#27496d;
    --crit:#9f2a1f; --warn:#875708; --cool:#3f5a73; --info:#5b6770;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  #milecheck{max-width:720px;margin:0 auto;padding:14px 16px;}

  .mc-header{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .mc-title{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0;}
  .mc-title b{font-size:12.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;}
  .mc-title span{color:var(--muted);font-size:11.5px;}
  .mc-demo,.mc-live{display:none;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:3px;}
  .mc-demo{color:#7a5b00;background:#f5efdb;border:1px solid #e4d8ad;}
  .mc-live{color:#1d6b46;background:#e6f1ea;border:1px solid #c2dcce;}
  .mc-demo.on,.mc-live.on{display:inline-block;}
  .mc-live .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#1d6b46;margin-right:5px;vertical-align:1px;}

  /* hero: the milepost as a data readout, not a colored card */
  .mc-hero{background:#fafbfc;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px;padding:12px 16px;margin-bottom:16px;}
  .mc-hero .label{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:1.1px;font-weight:600;}
  .mc-mp{display:flex;align-items:baseline;gap:5px;margin:3px 0 1px;}
  .mc-mp .num{font-size:33px;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
  .mc-mp .unit{font-size:12px;color:var(--faint);font-weight:600;text-transform:uppercase;}
  .mc-route{font-size:13px;color:var(--muted);}
  .mc-route strong{color:var(--ink);font-weight:700;}
  .mc-route .sep{color:var(--line);margin:0 7px;}
  .mc-route .state{color:var(--muted);}

  .mc-section-label{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:1.1px;font-weight:600;margin:0 0 7px 1px;}
  .mc-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  @media (max-width:560px){ .mc-cols{grid-template-columns:1fr;} }
  .mc-col-h{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 7px 1px;}
  .mc-col-active .mc-col-h{color:var(--crit);}
  .mc-count{background:var(--line);color:var(--muted);font-size:10px;font-weight:700;border-radius:3px;padding:0 5px;line-height:16px;}
  .mc-col-empty{font-size:12px;color:var(--faint);padding:11px 12px;border:1px dashed var(--line);border-radius:3px;}
  /* alerts: tight, muted rows — thin severity tick, no rainbow cards */
  .mc-alert{display:flex;gap:11px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--info);border-radius:3px;padding:9px 12px;margin-bottom:5px;}
  .mc-alert .body{flex:1;min-width:0;}
  .mc-alert .type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--info);}
  .mc-alert .desc{margin:2px 0 3px;color:var(--ink);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .mc-alert .meta{font-size:11.5px;color:var(--faint);display:flex;gap:9px;flex-wrap:wrap;}
  .mc-alert.closure{border-left-color:var(--crit);} .mc-alert.closure .type{color:var(--crit);}
  .mc-alert.construction{border-left-color:var(--warn);} .mc-alert.construction .type{color:var(--warn);}
  .mc-alert.weather{border-left-color:var(--cool);} .mc-alert.weather .type{color:var(--cool);}
  .mc-alert.info{border-left-color:var(--info);} .mc-alert.info .type{color:var(--info);}
  .mc-empty{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:18px;text-align:center;color:var(--muted);}
  .mc-foot{margin-top:16px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .mc-foot a{color:var(--accent);text-decoration:none;font-weight:600;}
  .mc-skeleton{color:var(--muted);padding:20px;text-align:center;}
</style>
</head>
<body>
  <div id="milecheck">
    <div class="mc-header">
      <div class="mc-title"><b>MileCheck</b><span>Live mile marker &amp; DOT alerts</span></div>
      <span class="mc-live" id="mc-live"><span class="dot"></span>Live</span>
      <span class="mc-demo" id="mc-demo">Demo position</span>
    </div>
    <div id="mc-content"><div class="mc-skeleton">Locating vehicle&hellip;</div></div>
    <div class="mc-foot">
      <span id="mc-updated">&mdash;</span>
      <span>50 states &middot; 42 live DOT feeds &middot; <a href="https://milecheckapp.com" target="_blank" rel="noopener">milecheckapp.com</a></span>
    </div>
  </div>

<script>
/* =================================================================
   MileCheck Add-In for MyGeotab / Geotab Drive
   -----------------------------------------------------------------
   Reads the vehicle position from the MyGeotab API, then calls the
   LIVE MileCheck Worker (existing /mileposts + /incidents endpoints)
   to render the nearest milepost + active DOT alerts. No separate
   backend required — works against production today.
   ================================================================= */
(function(){
  "use strict";

  var MILECHECK_API = "https://milepost-proxy.leahgerber93.workers.dev";
  // Demo vehicle position when not running inside Geotab (I-5, WA — Tacoma corridor).
  var DEMO_POS = { lat:47.2400, lon:-122.4300, bearing:0 };
  var ALERT_RADIUS_MI = 60, MAX_ALERTS = 12;

  // Bounding boxes for major freight-corridor states (extend to all 50 in production).
  var STATE_BOUNDS = {
    WA:{minLat:45.54,maxLat:49.00,minLon:-124.85,maxLon:-116.92}, OR:{minLat:41.99,maxLat:46.29,minLon:-124.57,maxLon:-116.46},
    CA:{minLat:32.50,maxLat:42.01,minLon:-124.50,maxLon:-114.10}, NV:{minLat:35.00,maxLat:42.00,minLon:-120.01,maxLon:-114.04},
    UT:{minLat:37.00,maxLat:42.00,minLon:-114.05,maxLon:-109.04}, AZ:{minLat:31.33,maxLat:37.00,minLon:-114.82,maxLon:-109.04},
    ID:{minLat:42.00,maxLat:49.00,minLon:-117.24,maxLon:-111.04}, MT:{minLat:44.36,maxLat:49.00,minLon:-116.05,maxLon:-104.04},
    CO:{minLat:37.001,maxLat:41.00,minLon:-109.05,maxLon:-102.04}, TX:{minLat:25.80,maxLat:36.50,minLon:-106.70,maxLon:-93.50},
    IL:{minLat:36.97,maxLat:42.51,minLon:-91.52,maxLon:-87.02}, OH:{minLat:38.40,maxLat:42.00,minLon:-84.82,maxLon:-80.52},
    FL:{minLat:24.40,maxLat:31.00,minLon:-87.63,maxLon:-80.03}, GA:{minLat:30.36,maxLat:35.00,minLon:-85.61,maxLon:-80.84},
    TN:{minLat:34.98,maxLat:36.68,minLon:-90.31,maxLon:-81.65}
  };
  var STATE_META = {
    WA:{name:"Washington",dot:"WSDOT",alerts:1}, OR:{name:"Oregon",dot:"TripCheck",alerts:1},
    CA:{name:"California",dot:"Caltrans",alerts:1}, NV:{name:"Nevada",dot:"NVRoads",alerts:1},
    UT:{name:"Utah",dot:"UDOT",alerts:1}, AZ:{name:"Arizona",dot:"AZ511",alerts:1},
    ID:{name:"Idaho",dot:"ITD",alerts:1}, MT:{name:"Montana",dot:"MDT",alerts:1},
    CO:{name:"Colorado",dot:"COtrip",alerts:1}, TX:{name:"Texas",dot:"DriveTexas",alerts:1},
    IL:{name:"Illinois",dot:"IDOT",alerts:1}, OH:{name:"Ohio",dot:"OHGO",alerts:1},
    FL:{name:"Florida",dot:"FL511",alerts:1}, GA:{name:"Georgia",dot:"511GA",alerts:1}, TN:{name:"Tennessee",dot:"TDOT",alerts:1}
  };

  function detectState(lat,lon){ for(var s in STATE_BOUNDS){ var b=STATE_BOUNDS[s];
    if(lat>=b.minLat&&lat<=b.maxLat&&lon>=b.minLon&&lon<=b.maxLon) return s; } return null; }
  function haversine(a,b,c,d){ var R=3958.8,p=Math.PI/180,dLat=(c-a)*p,dLon=(d-b)*p;
    var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
  function bearingToDir(b){ if(b==null) return ""; b=((b%360)+360)%360;
    return b>=45&&b<135?"EB":b>=135&&b<225?"SB":b>=225&&b<315?"WB":"NB"; }

  var WA_INTERSTATES={"5":1,"82":1,"90":1,"182":1,"205":1,"405":1,"705":1};
  function normalizeRoad(h){ if(!h) return ""; var m=h.match(/^SR[\s-]?(\d+)$/i);
    if(m&&WA_INTERSTATES[m[1]]) return "I-"+m[1]; if(m) return "SR-"+m[1]; return h; }

  // Map MileCheck classification → the 4 native UI buckets + a human label.
  function classify(text, eventType){
    var s=(text||"").toLowerCase();
    if(/crash|accident|collision|wreck|rollover|overturn/.test(s)||eventType==="AC") return {cls:"closure",label:"Crash",sev:"high"};
    if((/\bclosed\b|closure|road closed/.test(s))&&!/lane|ramp|rest area/.test(s)) return {cls:"closure",label:"Closure",sev:"high"};
    if(/snow|ice|icy|chain|blizzard|freezing|black ice/.test(s)) return {cls:"weather",label:"Winter",sev:"med"};
    if(/construction|roadwork|work zone|lane clos|paving/.test(s)||eventType==="RW") return {cls:"construction",label:"Construction",sev:"med"};
    if(/flood|wind|fog|storm|weather|rock|slide|debris/.test(s)||eventType==="WE"||eventType==="HZ") return {cls:"weather",label:"Weather",sev:"med"};
    return {cls:"info",label:"Advisory",sev:"low"};
  }
  function minsAgo(ts){ if(!ts) return null; var ms=(""+ts).length>=13?+ts:+ts*1000;
    if(!isFinite(ms)) { var d=Date.parse(ts); if(isNaN(d)) return null; ms=d; }
    var m=Math.round((Date.now()-ms)/60000); return (m>=0&&m<60*24*30)?m:null; }
  function rel(m){ if(m==null) return ""; if(m<1) return "just now"; if(m<60) return m+" min ago";
    var h=Math.floor(m/60); return h+(h===1?" hr ago":" hrs ago"); }
  function esc(t){ return (t||"").replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c];}); }
  function el(id){ return document.getElementById(id); }

  // Triage an alert into the two columns the dispatcher cares about.
  function bucket(a){
    var s=(a.desc||"").toLowerCase();
    var planned=/nightly|overnight|night work|nighttime|each night|seasonal|long-term|until further notice|reopening|scheduled|begins? \w+ \d|through \w+ \d|\d\s*(p\.?m\.?)\s*(-|to)\s*\d/.test(s);
    if(a.label==="Crash") return "active";
    if(/\bdelay|backed up|congest|stop-and-go|stopped traffic/.test(s)) return "active";
    if(a.label==="Closure" && !planned) return "active"; // closed right now
    return "planned"; // nightly / long-term closures, construction, weather
  }

  function render(data, isLive){
    el("mc-live").classList.toggle("on", !!isLive);
    el("mc-demo").classList.toggle("on", !isLive);
    var alerts=data.alerts||[];
    var dir=data.direction?(" "+data.direction):"";

    function alertCard(a){
      return '<div class="mc-alert '+a.cls+'"><div class="body">'
        +'<div class="type">'+esc(a.label)+'</div>'
        +(a.desc?'<div class="desc">'+esc(a.desc)+'</div>':'')
        +'<div class="meta"><span>'+esc(a.route||"")+'</span>'
        +'<span>'+(a.source?esc(a.source):'')+(a.updated!=null?(a.source?' &middot; ':'')+rel(a.updated):'')+'</span></div>'
        +'</div></div>';
    }
    function col(title, arr, kind){
      return '<div class="mc-col mc-col-'+kind+'"><div class="mc-col-h">'+title
        +' <span class="mc-count">'+arr.length+'</span></div>'
        +(arr.length ? arr.map(alertCard).join("") : '<div class="mc-col-empty">None right now.</div>')+'</div>';
    }

    var alertsBlock;
    if(data.alertsAvail===false){
      alertsBlock='<div class="mc-empty">Live DOT alerts aren’t connected in '+esc(data.state)+' yet — mile-marker tracking still works.</div>';
    } else {
      var active=[], planned=[];
      alerts.forEach(function(a){ (bucket(a)==="active"?active:planned).push(a); });
      alertsBlock='<div class="mc-cols">'
        +col("Active &mdash; needs attention", active, "active")
        +col("Planned / ongoing", planned, "planned")+'</div>';
    }

    var heroHtml = data.milepost!=null ?
      '<div class="mc-hero"><div class="label">Nearest mile marker</div>'
      +'<div class="mc-mp"><span class="num">'+data.milepost+'</span><span class="unit">MP</span></div>'
      +'<div class="mc-route"><strong>'+esc(data.route||"")+dir+'</strong>'
      +'<span class="sep">|</span><span class="state">'+esc(data.state||"")+'</span></div></div>' : '';

    el("mc-content").innerHTML = heroHtml + alertsBlock;
    el("mc-updated").textContent = "Updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  }

  function loadFor(lat, lon, bearing, isLive){
    var state=detectState(lat,lon), meta=state?STATE_META[state]:null;
    if(!state){ render({state:"this area",milepost:null,alerts:[],alertsAvail:false}, isLive); return; }
    var out={state:meta.name,route:"",direction:bearingToDir(bearing),milepost:null,
             alertsAvail:!!meta.alerts,alerts:[]};
    var jobs=[
      fetch(MILECHECK_API+"/mileposts?state="+state).then(function(r){return r.json();}).then(function(mps){
        if(!Array.isArray(mps)) return;
        var best=null,bd=Infinity,major=null,md=Infinity;
        for(var i=0;i<mps.length;i++){ var m=mps[i];
          var la=m.lat!=null?m.lat:m.latitude, lo=m.lon!=null?m.lon:m.longitude;
          if(la==null||lo==null) continue;
          var d=haversine(lat,lon,la,lo);
          if(d<bd){ bd=d; best=m; }
          if(/^I-/.test(normalizeRoad(m.highway||m.route||""))&&d<md){ md=d; major=m; } }
        var pick=(major&&md<=bd+2.0)?major:best;
        if(pick){ out.milepost=(pick.milepost!=null?pick.milepost:pick.mile)|0; out.route=normalizeRoad(pick.highway||pick.route||""); }
      }).catch(function(){})
    ];
    if(out.alertsAvail){
      jobs.push(fetch(MILECHECK_API+"/incidents?state="+state).then(function(r){return r.json();}).then(function(j){
        var list=(j&&j["incident-reports"])||[];
        list.forEach(function(inc){
          var loc=inc.location||{}, sl=loc["start-location"]||{};
          var la=sl["start-lat"], lo=sl["start-long"];
          var dist=(la!=null&&lo!=null)?haversine(lat,lon,la,lo):null;
          if(dist!=null&&dist>ALERT_RADIUS_MI) return;
          var txt=(inc.headline||"")+" "+(inc["impact-desc"]||"")+" "+(inc.description||"");
          var c=classify(txt, inc["event-type-id"]);
          out.alerts.push({ cls:c.cls, label:c.label, sev:c.sev,
            route:normalizeRoad(loc["route-id"]||loc["location-name"]||""),
            desc:((inc["impact-desc"]||inc.description||inc.headline||"").replace(/<[^>]+>/g," ").trim()).slice(0,160),
            source:meta.dot, updated:minsAgo(inc["last-updated"]||inc["update-time"]), dist:dist });
        });
      }).catch(function(){}));
    }
    Promise.all(jobs).then(function(){
      out.alerts.sort(function(a,b){ var sev={high:0,med:1,low:2};
        if(sev[a.sev]!==sev[b.sev]) return sev[a.sev]-sev[b.sev];
        return (a.dist==null?1e9:a.dist)-(b.dist==null?1e9:b.dist); });
      out.alerts=out.alerts.slice(0,MAX_ALERTS);
      render(out, isLive);
    });
  }

  // Pull the vehicle's last-known position from MyGeotab (null in a demo DB w/ no device).
  function getVehiclePosition(api, state){
    return new Promise(function(resolve){
      if(!api){ return resolve(null); }
      var search={};
      if(state&&state.device&&state.device.id){ search.deviceSearch={ id:state.device.id }; }
      try{
        api.call("Get", {typeName:"DeviceStatusInfo", search:search}, function(result){
          var pick=null;
          (result||[]).forEach(function(r){ if(r&&r.latitude!=null&&r.longitude!=null&&(r.latitude||r.longitude)){
            if(!pick||(r.dateTime||"")>(pick.dateTime||"")) pick=r; } });
          resolve(pick?{lat:pick.latitude,lon:pick.longitude,bearing:pick.bearing}:null);
        }, function(){ resolve(null); });
      }catch(e){ resolve(null); }
    });
  }

  function load(api, state){
    getVehiclePosition(api, state).then(function(pos){
      if(pos){ loadFor(pos.lat, pos.lon, pos.bearing, true); }
      else { loadFor(DEMO_POS.lat, DEMO_POS.lon, DEMO_POS.bearing, false); }
    });
  }

  /* ---- Geotab Add-In lifecycle ---------------------------------- */
  if(typeof geotab==="undefined"){ window.geotab={}; }
  geotab.addin = geotab.addin || {};
  geotab.addin.milecheck = function(){
    var api, st;
    return {
      initialize:function(freshApi, state, callback){ api=freshApi; st=state; if(callback) callback(); },
      focus:function(freshApi, state){ api=freshApi||api; st=state||st; load(api, st); },
      blur:function(){}
    };
  };

  /* ---- Standalone preview (browser, outside MyGeotab) ----------- */
  document.addEventListener("DOMContentLoaded", function(){
    setTimeout(function(){
      if(el("mc-content").querySelector(".mc-skeleton")){ load(null, null); }
    }, 400);
  });
})();
</script>
</body>
</html>
