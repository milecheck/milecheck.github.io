  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dash Display — Preorder List (internal)</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body{margin:0;background:#0f1116;color:#e8e8e8;font-family:-apple-system,sans-serif;padding:32px 20px}
    .wrap{max-width:860px;margin:0 auto}
    .tbl-wrap{overflow-x:auto}
    .units{color:#9aa0a8;font-size:13px;margin-top:6px}
    h1{font-size:20px;margin:0 0 6px}
    .sub{color:#9aa0a8;font-size:13px;margin:0 0 24px}
    input{width:100%;padding:12px 14px;font-size:15px;border-radius:8px;border:1px solid #333;background:#1a1d24;color:#fff;margin-bottom:12px;box-sizing:border-box}
    button{padding:10px 18px;font-size:14px;font-weight:600;border-radius:8px;border:0;background:#00A86B;color:#fff;cursor:pointer}
    .count{font-size:40px;font-weight:800;margin:24px 0 4px}
    .count-label{color:#9aa0a8;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
    table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13.5px}
    th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #262a33}
    th{color:#9aa0a8;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em}
    #err{color:#e08a6b;font-size:13px;margin-top:8px;display:none}
    #gate{display:block}
    #data{display:none}
    a.refresh{color:#00A86B;font-size:13px;cursor:pointer;text-decoration:underline}
  </style>
  <link rel="canonical" href="https://milecheckapp.com/internal/preorder-admin.html">
</head>
<body>
  <div class="wrap">
    <h1>Dash display — preorder list</h1>
    <p class="sub">Internal only. Not linked anywhere, no search indexing.</p>

    <div id="gate">
      <input type="password" id="secret" placeholder="Admin secret">
      <button onclick="load()">View list</button>
      <div id="err">Wrong secret, or the export endpoint is down.</div>
    </div>

    <div id="data">
      <div class="count" id="countNum">—</div>
      <div class="count-label">Total signups</div>
      <div class="units" id="units"></div>
      <a class="refresh" onclick="load()">Refresh</a>
      <div class="tbl-wrap"><table id="tbl">
        <thead><tr><th>Email</th><th>Name</th><th>Drives for</th><th>How many</th><th>Source</th><th>Signed up</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
  </div>

  <script>
    const KEY = 'preorder_admin_secret';
    const stored = localStorage.getItem(KEY);
    if (stored) document.getElementById('secret').value = stored;

    async function load() {
      const secret = document.getElementById('secret').value.trim();
      const err = document.getElementById('err');
      err.style.display = 'none';
      try {
        const res = await fetch('https://milepost-proxy.leahgerber93.workers.dev/preorder/export', {
          headers: { 'x-admin-secret': secret },
        });
        if (!res.ok) throw new Error('bad response');
        const data = await res.json();
        localStorage.setItem(KEY, secret);
        document.getElementById('gate').style.display = 'none';
        document.getElementById('data').style.display = 'block';
        document.getElementById('countNum').textContent = data.count;
        // role + quantity were added 2026-10-03. Older signups have neither.
        const ROLE_LABELS = { trucker: 'Truck driver', plow: 'Snow plow', tow: 'Tow', dot: 'DOT / road crew',
          ems: 'EMS / first responder', fleet: 'Fleet manager', everyday: 'Everyday driver', other: 'Other' };
        const asked = data.entries.filter(e => Number(e.quantity) > 0);
        const units = asked.reduce((n, e) => n + Number(e.quantity), 0);
        document.getElementById('units').textContent = asked.length
          ? `${units} units asked for, across ${asked.length} signup${asked.length === 1 ? '' : 's'} that gave a number`
          : '';
        const rows = document.getElementById('rows');
        rows.innerHTML = '';
        // Signup fields are whatever a stranger typed into the form. Build cells with
        // textContent so a script in a "name" renders as text, never runs (2026-09-28 review).
        const cell = (text) => { const td = document.createElement('td'); td.textContent = text; return td; };
        data.entries.slice().reverse().forEach(e => {
          const tr = document.createElement('tr');
          const d = new Date(e.firstSeenAt).toLocaleDateString();
          tr.appendChild(cell(String(e.email || '')));
          tr.appendChild(cell(e.name ? String(e.name) : '—'));
          tr.appendChild(cell(e.role ? (ROLE_LABELS[e.role] || String(e.role)) : '—'));
          tr.appendChild(cell(Number(e.quantity) > 0 ? String(e.quantity) : '—'));
          tr.appendChild(cell(e.source ? String(e.source) : '—'));
          tr.appendChild(cell(d));
          rows.appendChild(tr);
        });
      } catch (e) {
        err.style.display = 'block';
      }
    }
    if (stored) load();
  </script>
</body>
</html>
