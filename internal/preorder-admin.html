  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up lists (internal)</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body{margin:0;background:#0f1116;color:#e8e8e8;font-family:-apple-system,sans-serif;padding:32px 20px}
    .wrap{max-width:860px;margin:0 auto}
    .tbl-wrap{overflow-x:auto}
    .units{color:#9aa0a8;font-size:13px;margin-top:6px}
    h2{font-size:16px;margin:40px 0 0;padding-top:24px;border-top:1px solid #262a33}
    .empty{color:#9aa0a8;font-size:13px;margin-top:12px}
    button.copy{margin-top:14px;background:#262a33;font-weight:500}
    .copied{color:#00A86B;font-size:13px;margin-left:10px}
    h1{font-size:20px;margin:0 0 6px}
    .sub{color:#9aa0a8;font-size:13px;margin:0 0 24px}
    input{width:100%;padding:12px 14px;font-size:15px;border-radius:8px;border:1px solid #333;background:#1a1d24;color:#fff;margin-bottom:12px;box-sizing:border-box}
    button{padding:10px 18px;font-size:14px;font-weight:600;border-radius:8px;border:0;background:#00A86B;color:#fff;cursor:pointer}
    .count{font-size:40px;font-weight:800;margin:24px 0 4px}
    .count-label{color:#9aa0a8;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
    table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13.5px}
    th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #262a33}
    th{color:#9aa0a8;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em}
    #err{color:#e08a6b;font-size:13px;margin-top:8px;display:none}
    #gate{display:block}
    #data{display:none}
    a.refresh{color:#00A86B;font-size:13px;cursor:pointer;text-decoration:underline}
  </style>
  <link rel="canonical" href="https://milecheckapp.com/internal/preorder-admin.html">
</head>
<body>
  <div class="wrap">
    <h1>Sign-up lists</h1>
    <p class="sub">Internal only. Not linked anywhere, no search indexing.</p>

    <div id="gate">
      <input type="password" id="secret" placeholder="Admin secret">
      <button onclick="load()">View list</button>
      <div id="err">Wrong secret, or the export endpoint is down.</div>
    </div>

    <div id="data">
      <a class="refresh" onclick="load()">Refresh</a>
      <h2>Dash display early access</h2>
      <div class="count" id="countNum">—</div>
      <div class="count-label">Sign-ups</div>
      <div class="units" id="units"></div>
      <button class="copy" onclick="copyEmails('dash', this)">Copy all emails</button>
      <div class="tbl-wrap"><table id="tbl">
        <thead><tr><th>Email</th><th>Name</th><th>Drives for</th><th>How many</th><th>Comments</th><th>Source</th><th>Signed up</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <h2>Mountain Visibility Android waitlist</h2>
      <div class="count" id="mvCount">—</div>
      <div class="count-label">Sign-ups</div>
      <button class="copy" onclick="copyEmails('mv', this)">Copy all emails</button>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Email</th><th>Source</th><th>Signed up</th></tr></thead>
        <tbody id="mvRows"></tbody>
      </table></div>
    </div>
  </div>

  <script>
    const KEY = 'preorder_admin_secret';
    const stored = localStorage.getItem(KEY);
    if (stored) document.getElementById('secret').value = stored;

    async function load() {
      const secret = document.getElementById('secret').value.trim();
      const err = document.getElementById('err');
      err.style.display = 'none';
      try {
        const res = await fetch('https://milepost-proxy.leahgerber93.workers.dev/preorder/export', {
          headers: { 'x-admin-secret': secret },
        });
        if (!res.ok) throw new Error('bad response');
        const data = await res.json();
        localStorage.setItem(KEY, secret);
        document.getElementById('gate').style.display = 'none';
        document.getElementById('data').style.display = 'block';
        // Each entry carries `list` (Worker 2026-10-03). Older exports don't; their
        // Mountain sign-ups are the ones whose source starts "mountain-visibility".
        const listOf = (e) => e.list || (/^mountain-visibility/i.test(String(e.source || '')) ? 'mountain-android' : 'dash');
        const dash = data.entries.filter(e => listOf(e) === 'dash');
        // A Mountain sign-up from before the split can also exist under the new key.
        // Entries arrive oldest first, so keep the first one per email.
        const seen = new Set();
        const mv = data.entries.filter(e => listOf(e) === 'mountain-android')
          .filter(e => (seen.has(e.email) ? false : seen.add(e.email)));
        // For the day the device ships: paste into the BCC line, never To or CC.
        window.__lists = { dash: dash.map(e => e.email), mv: mv.map(e => e.email) };
        document.getElementById('countNum').textContent = dash.length;
        document.getElementById('mvCount').textContent = mv.length;
        // role + quantity were added 2026-10-03. Older signups have neither.
        const ROLE_LABELS = { trucker: 'Truck driver', plow: 'Snow plow', tow: 'Tow', dot: 'DOT / road crew',
          ems: 'EMS / fire / law enforcement', fleet: 'Fleet manager', everyday: 'Everyday driver', other: 'Other' };
        const asked = dash.filter(e => Number(e.quantity) > 0);
        const units = asked.reduce((n, e) => n + Number(e.quantity), 0);
        document.getElementById('units').textContent = asked.length
          ? `${units} units asked for, across ${asked.length} signup${asked.length === 1 ? '' : 's'} that gave a number`
          : '';
        // Signup fields are whatever a stranger typed into the form. Build cells with
        // textContent so a script in a "name" renders as text, never runs (2026-09-28 review).
        const cell = (text) => { const td = document.createElement('td'); td.textContent = text; return td; };
        const fill = (tbodyId, list, columns) => {
          const tbody = document.getElementById(tbodyId);
          tbody.innerHTML = '';
          list.slice().reverse().forEach(e => {
            const tr = document.createElement('tr');
            columns.forEach(fn => tr.appendChild(cell(fn(e))));
            tbody.appendChild(tr);
          });
        };
        const email = (e) => String(e.email || '');
        const source = (e) => (e.source ? String(e.source) : '—');
        const date = (e) => new Date(e.firstSeenAt).toLocaleDateString();
        fill('rows', dash, [
          email,
          (e) => (e.name ? String(e.name) : '—'),
          (e) => (e.role ? (ROLE_LABELS[e.role] || String(e.role)) : '—'),
          (e) => (Number(e.quantity) > 0 ? String(e.quantity) : '—'),
          (e) => (e.comments ? String(e.comments) : '—'),
          source,
          date,
        ]);
        fill('mvRows', mv, [email, source, date]);
      } catch (e) {
        err.style.display = 'block';
      }
    }
    async function copyEmails(which, btn) {
      const emails = (window.__lists && window.__lists[which]) || [];
      const text = emails.join(', ');
      try { await navigator.clipboard.writeText(text); }
      catch { window.prompt('Copy these emails:', text); return; }
      const note = document.createElement('span');
      note.className = 'copied';
      note.textContent = `${emails.length} copied. Paste into BCC.`;
      btn.after(note);
      setTimeout(() => note.remove(), 4000);
    }
    if (stored) load();
  </script>
</body>
</html>
